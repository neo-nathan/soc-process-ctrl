<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>进程管控 - 审计日志列表</title>
<style>

/* 页面基础样式：去掉默认外边距，字体用系统中文字体 */
body{margin:0;font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#f0f2f5}
/* 链接颜色：参考截图里的蓝色 */
a{color:#1e88e5;text-decoration:none}a:hover{color:#1565c0}
/* 表格行悬停时浅蓝底色 */
.row:hover{background:#f4f8fd}
/* 表格里超长文字单行省略 */
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 复选框统一大小 */
input[type=checkbox]{width:14px;height:14px;margin:0;accent-color:#1e88e5}
/* 主按钮（创建）悬停 */
.pbtn:hover{background:#1565c0;color:#ffffff}
/* 高级查询面板里的点选项：选中 = 蓝框蓝字，未选中 = 无框，悬停变蓝 */
.chip:hover{color:#1e88e5}
/* 查询面板里的输入框 */
.qi{box-sizing:border-box;height:30px;padding:0 10px;font-family:inherit;font-size:13px;color:#333333;background:#ffffff;border:1px solid #d5d9e0;border-radius:2px}
.qi:focus{outline:none;border-color:#1e88e5}
.qi::placeholder{color:#b0b8c4}
/* "高级搜索"按钮悬停 */
.advbtn:hover{color:#1e88e5}
/* 下拉框统一外观 */
/* 弹窗表单：输入框 / 下拉 / 多行文本 统一外观 */
.fi{box-sizing:border-box;width:100%;height:32px;padding:0 10px;font-family:inherit;font-size:13px;color:#333333;background:#ffffff;border:1px solid #d5d9e0;border-radius:3px}
.fi:focus{outline:none;border-color:#1e88e5}
.fi::placeholder{color:#b0b8c4}
textarea.fi{height:72px;padding:8px 10px;resize:none}
/* 单选框 */
input[type=radio]{width:14px;height:14px;margin:0;accent-color:#1e88e5}
/* 取消按钮悬停 */
.cbtn:hover{border-color:#1e88e5;color:#1e88e5}
select{font-family:inherit;font-size:13px;color:#333333;background:#ffffff;border:1px solid #d5d9e0;border-radius:3px;height:30px;padding:0 8px}

/* 加白 / 加黑 菜单项：悬停浅蓝底蓝字，按下底色再深一点 */
.mitem:hover{background:#eef4fc !important;color:#1e88e5 !important}
.mitem:active{background:#d6e6fa !important;color:#1565c0 !important}
/* 本页表格所有格子宽度按"含内边距"计算，列宽就是真实占位宽度 */
.tcell{box-sizing:border-box;flex-shrink:0;padding:0 8px}
/* 分页：页码 / 上一页 / 下一页 按钮；当前页蓝底白字；不可点（第一页的上一页等）变灰 */
.pg{min-width:30px;height:28px;padding:0 6px;border:1px solid #d5d9e0;border-radius:2px;background:#ffffff;color:#333333;font-family:inherit;font-size:13px;cursor:pointer}
.pg:hover:not([disabled]){border-color:#1e88e5;color:#1e88e5}
.pg[disabled]{color:#c0c6cf;background:#f5f7fa;cursor:not-allowed}
.pg.on{background:#1e88e5;border-color:#1e88e5;color:#ffffff}
/* 左侧导航：悬停效果（截图 14）—— 底色变亮一点的深蓝、左侧出现亮蓝竖条、文字变白；一级菜单的图标变亮蓝 */
.nav1:hover,.nav2:hover{background:#0d3479 !important;border-left-color:#08a7ff !important;color:#ffffff !important}
.nav1:hover .nav-ico{color:#33b8ff !important}
/* 终端分组树：悬停浅灰底（选中浅蓝底蓝字写在行内） */
.gnode:hover{background:#f2f5f9}

/* 独立页面：页面固定 1920×1080，窗口小时可以滚动 */
html,body{margin:0}
</style>
</head>
<body>
<!-- 渲染结果放这里 -->
<div id="app"></div>

<!-- 页面模板（和设计稿一致） -->
<template id="page-tpl">

<!-- ============ 整个页面：固定 1920 x 1080 ============ -->
<div style="position: relative; width: 1920px; height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; background: #f0f2f5; color: #333333; font-size: 14px; overflow: hidden;">

  <!-- ============ 顶栏（50px 高） ============ -->
  <div style="height: 50px; flex-shrink: 0; display: flex; align-items: stretch; background: #ffffff; border-bottom: 1px solid #e3e6eb;">
    <!-- 左上角 LOGO 区：深蓝底 -->
    <div style="width: 180px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #0f2a5c; color: #ffffff; font-size: 22px; font-weight: 800; letter-spacing: 2px;">
      SOC
    </div>
    <!-- 系统标题 -->
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 20px; flex-grow: 1;">
      <span style="font-size: 18px; font-weight: 700; color: #1f2d3d;">终端威胁检测与响应系统</span>
      <span style="font-size: 14px; color: #1f2d3d;">· 专用</span>
      <span style="font-size: 13px; color: #8a94a6; font-style: italic; margin-left: 12px;">一切尽在掌握！</span>
    </div>
    <!-- 右侧：消息数 / 用户 / 下载 -->
    <div style="display: flex; align-items: center; gap: 16px; padding: 0 20px;">
      <div style="display: flex; align-items: center; gap: 6px; background: #f2f4f7; border-radius: 4px; padding: 4px 10px; color: #4a5568;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
        <span>101</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: #f2f4f7; border-radius: 16px; padding: 4px 12px 4px 6px; color: #4a5568;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e88e5" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
        <span>optAdmin</span>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #1e88e5; display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5"><path d="M12 4v12M6 11l6 6 6-6"></path></svg>
      </div>
    </div>
  </div>

  <!-- ============ 顶栏以下：左导航 + 右侧内容 ============ -->
  <div style="flex-grow: 1; display: flex; min-height: 0;">

    <!-- ============ 左侧主导航（180px，深蓝） ============ -->
    <nav style="width: 180px; flex-shrink: 0; background: #0f2a5c; color: #ffffff; display: flex; flex-direction: column; padding-top: 6px;">
      <!-- 导航菜单列表：数据在下方脚本里，选中项高亮 -->
      <div style="display: flex; flex-direction: column;">
        <template data-sc="for" list="{{ menus }}" as="m" hint-placeholder-count="19">
          <!-- 一级菜单：普通状态浅色文字；选中 / 悬停时底色变亮、左侧亮蓝竖条、文字变白、图标变亮蓝（截图 13 / 14）
               有二级菜单的在右边显示箭头（展开朝上、收起朝下），点击展开 / 收起 -->
          <a href="#" class="nav1" onClick="{{ m.toggle }}" aria-expanded="{{ m.expanded }}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 0 0 34px; box-sizing: border-box; color: {{ m.fg }}; font-size: 14px; background: {{ m.bg }}; border-left: 3px solid {{ m.bar }};">
            <span class="nav-ico" style="display: flex; color: {{ m.icoColor }};"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ m.icon }}"></path></svg></span>
            <span style="flex-grow: 1;">{{ m.label }}</span>
            <template data-sc="if" value="{{ m.hasSub }}" hint-placeholder-val="{{ false }}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 16px; transform: rotate({{ m.caret }});"><path d="M6 9l6 6 6-6"></path></svg>
            </template>
          </a>
          <!-- 二级菜单：缩进，前面一个小圆点（截图 13）；当前页面：底色变亮 + 左侧亮蓝竖条 + 白字 + 亮蓝圆点；悬停同样效果（截图 14） -->
          <template data-sc="if" value="{{ m.expanded }}" hint-placeholder-val="{{ false }}">
            <template data-sc="for" list="{{ m.children }}" as="c" hint-placeholder-count="5">
              <a href="{{ c.href }}" class="nav2" aria-current="{{ c.current }}" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 0 0 65px; box-sizing: border-box; color: {{ c.fg }}; font-size: 14px; background: {{ c.bg }}; border-left: 3px solid {{ c.bar }};">
                <span style="width: 5px; height: 5px; border-radius: 50%; background: {{ c.dot }}; flex-shrink: 0;"></span>
                <span>{{ c.label }}</span>
              </a>
            </template>
          </template>
        </template>
      </div>
      <!-- 底部版权信息 -->
      <div style="margin-top: auto; padding: 14px 10px 12px; border-top: 1px solid #1d3f7d; text-align: center; font-size: 12px; line-height: 18px; color: #c5d0e3;">
        <div>[公司名称]</div>
        <div>版权所有</div>
        <div>版本：3.0 build：305034</div>
      </div>
    </nav>

    <!-- ============ 右侧主内容区：审计日志列表 ============ -->
    <!-- ============ 左侧：终端分组面板（和概览页一样）；点分组 → 列表只显示这个分组终端的日志 ============ -->
    <aside style="width: 250px; flex-shrink: 0; display: flex; flex-direction: column; margin: 12px 0 12px 12px; background: #ffffff; border: 1px solid #e3e6eb;">
      <!-- 标题：终端分组 [在线 / 总数]（选中分组的） -->
      <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; flex-shrink: 0; padding: 0 12px; border-bottom: 1px solid #eef0f3;">
        <span style="font-size: 15px; font-weight: 700; color: #1f2d3d;">终端分组 <span style="font-weight: 400; font-size: 13px; color: #1e88e5;">[{{ groupOnline }}/{{ groupTotal }}]</span></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a94a6" stroke-width="2" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v8"></path></svg>
      </div>
      <!-- 分组树：根管理组可以展开 / 收起；右边数字 = 在线 / 总数 -->
      <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 6px 0;">
        <template data-sc="for" list="{{ groups }}" as="g" hint-placeholder-count="8">
          <div class="gnode" onClick="{{ g.pick }}" aria-selected="{{ g.on }}" style="display: flex; align-items: center; gap: 6px; height: 32px; padding-left: {{ g.indent }}px; padding-right: 10px; cursor: pointer; background: {{ g.bg }}; color: {{ g.fg }}; font-size: 13px;">
            <!-- 展开 / 收起按钮（只有根管理组有）：方框里 - 或 + -->
            <template data-sc="if" value="{{ g.isRoot }}" hint-placeholder-val="{{ false }}">
              <span onClick="{{ g.toggle }}" style="width: 12px; height: 12px; border: 1px solid #8a94a6; border-radius: 1px; display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; color: #5a6475; flex-shrink: 0; background: #ffffff;">{{ g.sign }}</span>
            </template>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0; color: {{ g.icoColor }};"><path d="M9 3h6v5H9zM4 16h6v5H4zM14 16h6v5h-6zM12 8v4M7 16v-4h10v4"></path></svg>
            <span style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ g.name }}</span>
            <span style="font-size: 12px; color: #8a94a6;">{{ g.online }}/{{ g.total }}</span>
          </div>
        </template>
      </div>
    </aside>

    <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; margin: 12px; background: #ffffff; border: 1px solid #e3e6eb;">

      <!-- 页签：进程管控概览下 3 个页签 概览 / 日志 / 策略（当前选中：日志）；统计分析页已不在页签里（页面保留）；其他页面都在左侧二级菜单里
           选中的页签：白底 + 顶部蓝线 + 蓝字 -->
      <div style="display: flex; align-items: stretch; height: 44px; flex-shrink: 0; background: #f5f7fa; border-bottom: 1px solid #e3e6eb;">
        <a href="概览.html" style="width: 116px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #e3e6eb; color: #333333; font-size: 15px;">概览</a>
        <a href="审计日志列表.html" style="position: relative; z-index: 1; margin-bottom: -1px; width: 116px; display: flex; align-items: center; justify-content: center; background: #ffffff; border-top: 2px solid #1e88e5; border-right: 1px solid #e3e6eb; border-bottom: 1px solid #ffffff; color: #1e88e5; font-weight: 700; font-size: 15px;">日志</a>
        <a href="策略详情.html" style="width: 116px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #e3e6eb; color: #333333; font-size: 15px;">策略</a>
      </div>

      <!-- 工具栏：左 = 加白 / 加黑（先勾选日志，再在弹窗里选名单）；右 = 高级搜索 / 刷新 / 列设置 -->
      <div style="display: flex; align-items: center; justify-content: space-between; height: 50px; flex-shrink: 0; padding: 0 10px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <!-- 加白 / 加黑：把列表里勾选的日志对应的进程（可跨页勾选）加入名单；点了先弹出「选择白名单 / 选择黑名单」弹窗 -->
          <button class="cbtn" onClick="{{ act.white }}" style="display: flex; align-items: center; height: 30px; padding: 0 14px; background: #ffffff; border: 1px solid #1e88e5; border-radius: 3px; color: #1e88e5; font-size: 14px; font-family: inherit; cursor: pointer; white-space: nowrap;">加白</button>
          <button class="cbtn" onClick="{{ act.black }}" style="display: flex; align-items: center; height: 30px; padding: 0 14px; background: #ffffff; border: 1px solid #1e88e5; border-radius: 3px; color: #1e88e5; font-size: 14px; font-family: inherit; cursor: pointer; white-space: nowrap;">加黑</button>
          <span style="font-size: 12px; color: #8a94a6;">勾选日志后批量加白 / 加黑</span>
        </div>
        <div style="display: flex; align-items: center; gap: 18px; color: #4a5568;">
          <!-- 高级搜索：点击展开 / 折叠下方的查询面板；展开时蓝字、箭头朝上；页面加载时默认折叠 -->
          <button class="advbtn" onClick="{{ toggleAdv }}" aria-expanded="{{ advExpanded }}" style="display: flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; cursor: pointer; font-family: inherit; font-size: 14px; color: {{ advColor }};">高级搜索
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform: rotate({{ advDeg }}deg);"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <button aria-label="刷新" style="width: 28px; height: 28px; border: 0; background: transparent; cursor: pointer; color: #4a5568;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>
          </button>
          <button aria-label="列设置" style="width: 28px; height: 28px; border: 0; background: transparent; cursor: pointer; color: #4a5568;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M12 4v16M17 4v16"></path></svg>
          </button>
        </div>
      </div>

      <!-- ============ 高级查询面板：默认折叠，点"高级搜索"展开（样式参考截图 12） ============
           条件顺序：时间范围 / 动作 / 原因 / 系统类型 / 筛选条件（动作 已拦截 / 告警 分别对应 拦截 / 审计 模式，所以不单设策略模式条件）
           两类条件：① 点选项，点了立刻筛选；② 输入项（指定日期 / 关键字），填好后点"筛选"才生效 -->
      <template data-sc="if" value="{{ advOpen }}" hint-placeholder-val="{{ false }}">
        <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; margin: 0 10px 10px; padding: 12px 16px; background: #eef1f6; font-size: 13px;">
          <!-- 时间范围（点选，点了立刻筛选）：全部 / 本周 / 本月 / 上月；右边"指定"是输入项，填好后点"筛选"生效 -->
          <div style="display: flex; align-items: center; gap: 8px; height: 30px;">
            <span style="width: 84px; flex-shrink: 0; text-align: right; color: #5a6475;">时间范围：</span>
            <template data-sc="for" list="{{ timeChips }}" as="c" hint-placeholder-count="4">
              <button class="chip" onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="min-width: 76px; height: 28px; padding: 0 14px; border: 1px solid {{ c.border }}; border-radius: 2px; background: {{ c.bg }}; color: {{ c.color }}; font-family: inherit; font-size: 13px; cursor: pointer;">{{ c.label }}</button>
            </template>
            <span style="margin-left: 24px; color: #5a6475;">指定：</span>
            <!-- 开始日期：文本框固定 YYYY-MM-DD（浏览器自带日期框的显示格式跟随系统语言，没法固定，所以用文本框）；
                 点右侧日历图标弹出系统日期选择器，选完自动填成 YYYY-MM-DD -->
            <div style="position: relative; width: 150px; height: 30px;">
              <input class="qi" type="text" maxlength="10" placeholder="开始日期" aria-label="开始日期" value="{{ draft.from }}" onInput="{{ inFrom }}" style="width: 150px; padding-right: 30px;">
              <button type="button" aria-label="选择开始日期" onClick="{{ openPicker }}" style="position: absolute; top: 1px; right: 1px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; cursor: pointer; color: #8a94a6;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></button>
              <input type="date" tabindex="-1" aria-hidden="true" value="{{ draft.from }}" onInput="{{ pickedFrom }}" style="position: absolute; right: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; pointer-events: none;">
            </div>
            <span style="color: #8a94a6;">—</span>
            <!-- 结束日期：文本框固定 YYYY-MM-DD（浏览器自带日期框的显示格式跟随系统语言，没法固定，所以用文本框）；
                 点右侧日历图标弹出系统日期选择器，选完自动填成 YYYY-MM-DD -->
            <div style="position: relative; width: 150px; height: 30px;">
              <input class="qi" type="text" maxlength="10" placeholder="结束日期" aria-label="结束日期" value="{{ draft.to }}" onInput="{{ inTo }}" style="width: 150px; padding-right: 30px;">
              <button type="button" aria-label="选择结束日期" onClick="{{ openPicker }}" style="position: absolute; top: 1px; right: 1px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; cursor: pointer; color: #8a94a6;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></button>
              <input type="date" tabindex="-1" aria-hidden="true" value="{{ draft.to }}" onInput="{{ pickedTo }}" style="position: absolute; right: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; pointer-events: none;">
            </div>
            <!-- 日期填错时的红字提示（点"筛选"时检查） -->
            <template data-sc="if" value="{{ hasDateErr }}" hint-placeholder-val="{{ false }}">
              <span role="alert" style="margin-left: 8px; color: #e53935;">{{ dateErr }}</span>
            </template>
          </div>
          <!-- 动作（点选，点了立刻筛选） -->
          <div style="display: flex; align-items: center; gap: 8px; height: 30px;">
            <span style="width: 84px; flex-shrink: 0; text-align: right; color: #5a6475;">动作：</span>
            <template data-sc="for" list="{{ actChips }}" as="c" hint-placeholder-count="4">
              <button class="chip" onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="min-width: 76px; height: 28px; padding: 0 14px; border: 1px solid {{ c.border }}; border-radius: 2px; background: {{ c.bg }}; color: {{ c.color }}; font-family: inherit; font-size: 13px; cursor: pointer;">{{ c.label }}</button>
            </template>
          </div>
          <!-- 原因（点选，点了立刻筛选） -->
          <div style="display: flex; align-items: center; gap: 8px; height: 30px;">
            <span style="width: 84px; flex-shrink: 0; text-align: right; color: #5a6475;">原因：</span>
            <template data-sc="for" list="{{ reasonChips }}" as="c" hint-placeholder-count="4">

<script>
// 页面属性的默认值（设计稿右侧属性面板里的那些开关）
const PROP_DEFS = {"$preview": {"width": 1920, "height": 1080}};

// ======================================================================
// 小渲染器：替代设计工具的运行时，让页面脱离设计工具也能直接打开
// 支持：{{ a.b }} 取值、<template data-sc="for"> 循环、<template data-sc="if"> 条件、
//      onClick / onChange 事件、setState 后整页重新渲染
// ======================================================================

// 页面逻辑类的父类：提供 props（属性默认值）、state（页面状态）、setState（改状态并重绘）
class DCLogic {
  constructor(props) {
    this.props = props || {};
    this.state = {};
  }
  setState(patch) {
    Object.assign(this.state, patch);   // 合并新状态
    render();                           // 重新画整页
  }
}

// 按 "a.b.c" 从作用域里取值；true / false / 数字 这种字面量直接返回
function lookup(scope, path) {
  path = path.trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  let cur = scope;
  for (const key of path.split('.')) {
    if (cur == null) return undefined;
    cur = cur[key];
  }
  return cur;
}

const WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;   // 整个属性值就是一个 {{ }}（要保留原始类型，比如函数、布尔）
const PART = /\{\{([^}]+)\}\}/g;           // 字符串里夹着的 {{ }}

// 把字符串里的 {{ }} 都换成值
function interp(str, scope) {
  return str.replace(PART, (_, p) => {
    const v = lookup(scope, p);
    return v == null ? '' : String(v);
  });
}

// 递归渲染一个模板节点，结果追加到 parent 里
function renderNode(node, scope, parent) {
  // 文字节点：替换 {{ }}
  if (node.nodeType === 3) {
    parent.appendChild(document.createTextNode(interp(node.nodeValue, scope)));
    return;
  }
  if (node.nodeType !== 1) return;   // 注释等其他节点跳过

  // 循环：<template data-sc="for" list="{{ rows }}" as="r">
  if (node.tagName === 'TEMPLATE' && node.dataset.sc === 'for') {
    const list = lookup(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];
    const as = node.getAttribute('as');
    list.forEach((item, i) => {
      // 子作用域：继承外层，再加上当前这一项和序号
      const child = Object.create(scope);
      child[as] = item;
      child.$index = i;
      node.content.childNodes.forEach((n) => renderNode(n, child, parent));
    });
    return;
  }
  // 条件：<template data-sc="if" value="{{ x }}">，值为真才渲染里面的内容
  if (node.tagName === 'TEMPLATE' && node.dataset.sc === 'if') {
    const v = lookup(scope, node.getAttribute('value').replace(/[{}]/g, ''));
    if (v) node.content.childNodes.forEach((n) => renderNode(n, scope, parent));
    return;
  }

  // 普通元素：复制标签，逐个处理属性
  // 必须按原节点的命名空间创建：svg / path 这些图标属于 SVG 命名空间，
  // 用 createElement 建出来是"假的 svg"，浏览器不会画（之前小箭头、图标不显示就是这个原因）
  const el = node.namespaceURI === 'http://www.w3.org/1999/xhtml'
    ? document.createElement(node.localName)
    : document.createElementNS(node.namespaceURI, node.localName);
  const props = {};   // 要在插入后设置的属性（selected / checked / value）
  for (const attr of Array.from(node.attributes)) {
    const name = attr.name;
    const m = attr.value.match(WHOLE);
    if (m) {
      const v = lookup(scope, m[1]);
      if (name.startsWith('on')) {
        // 事件：onClick → click；链接 href="#" 的点击不跳页面
        if (typeof v === 'function') {
          el.addEventListener(name.slice(2).toLowerCase(), (e) => {
            if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
            v(e);
          });
        }
      } else if (name === 'checked' || name === 'selected' || name === 'value') {
        props[name] = v;                      // 这几个要用属性赋值才生效
      } else if (v === false || v == null) {
        // false / 空值：不写这个属性
      } else {
        el.setAttribute(name, String(v));
      }
    } else if (attr.value.indexOf('{{') >= 0) {
      el.setAttribute(name, interp(attr.value, scope));
    } else if (name === 'checked' || name === 'selected') {
      props[name] = true;                     // 写死的 checked / selected
    } else {
      el.setAttribute(name, attr.value);
    }
  }
  // 子节点（<template> 自己的内容在 .content 里）
  const kids = node.tagName === 'TEMPLATE' ? node.content.childNodes : node.childNodes;
  kids.forEach((n) => renderNode(n, scope, el));
  parent.appendChild(el);
  // 插入后再设置属性（option 的 selected 必须在进了 select 之后设）
  if ('value' in props) el.value = props.value == null ? '' : props.value;
  if ('checked' in props) el.checked = !!props.checked;
  if ('selected' in props) el.selected = !!props.selected;
}

// 整页渲染：取最新数据 → 按模板生成 DOM → 替换掉旧的
function render() {
  const vals = COMP.renderVals();
  const root = document.getElementById('app');
  const frag = document.createDocumentFragment();
  TPL.content.childNodes.forEach((n) => renderNode(n, vals, frag));
  // 保留页面滚动位置，避免每次点击后跳回顶部
  const x = window.scrollX, y = window.scrollY;
  root.replaceChildren(frag);
  window.scrollTo(x, y);
}

    if (cfg && typeof cfg === 'object' && 'default' in cfg) defaults[k] = cfg.default;
  }
  COMP = new Component(defaults);
  render();
});

    const osCat = (os) => os === 'Windows' ? 'Windows' : 'Linux/信创';   // 日志里的具体系统 → 名单的系统大类（CentOS / Ubuntu 都算 Linux/信创）
    // 名单类型：新建的看第 3 项（'w' 白 / 'b' 黑），原有的按名称结尾判断
    const kindOf = (n) => LIST_META[n][2] || (n.endsWith('白名单') ? 'w' : 'b');
    const listsOf = (kind, cat) => Object.keys(LIST_META).filter((n) => kindOf(n) === kind && LIST_META[n][0] === cat);

    // ======================================================================
    // 高级查询（写法和 demo/白名单列表.html 一样）
    //   state.advOpen   查询面板是否展开（页面加载时默认折叠）
    //   state.<点选条件> 点选项，点了立刻 setState 重新筛选
    //   this._draft     输入框里正在填的内容（打字时不刷新整页，避免输入框丢焦点）
    //   state.applied   点"筛选"时把 _draft 拷一份到这里，真正参与筛选的是它
    // ======================================================================

    // ---------- 终端分组（和概览页一致：分组名 → [在线, 总数]）；点分组 → 只看这个分组终端的日志 ----------
    const GROUPS = { '默认分组': [2, 3], '服务器': [3, 4], 'wrh': [3, 3], 'verify-dept': [1, 1], '办公区': [1, 2], '研发部': [1, 1], '试点组': [2, 2] };
    const curGroup = st.group || '根管理组';
    const rootOpen = st.rootOpen !== false;               // 根管理组默认展开
    const cnt = (g) => g === '根管理组'
      ? Object.values(GROUPS).reduce((a, v) => [a[0] + v[0], a[1] + v[1]], [0, 0])
      : GROUPS[g];
    const node = (name, isRoot) => {
      const on = name === curGroup, c = cnt(name);
      return {
        name, isRoot, on, online: c[0], total: c[1],
        indent: isRoot ? 12 : 44,
        sign: rootOpen ? '−' : '+',
        bg: on ? '#e8f1fb' : 'transparent', fg: on ? '#1e88e5' : '#333333', icoColor: on ? '#1e88e5' : '#5a6475',
        pick: () => this.setState({ group: name }),
        toggle: (e) => { e.stopPropagation(); this.setState({ rootOpen: !rootOpen }); },
      };
    };
    const groups = [node('根管理组', true)].concat(rootOpen ? Object.keys(GROUPS).map((g) => node(g, false)) : []);
    const cg = cnt(curGroup);
    const groupOnline = cg[0], groupTotal = cg[1];
    const Q_EMPTY = { field: 'path', kw: '', from: '', to: '' };   // 默认按进程路径搜
    if (!this._draft) this._draft = { ...Q_EMPTY };
    const draft = this._draft;
    const applied = st.applied || Q_EMPTY;
    const TODAY = '2026-09-28';   // 演示用的"今天"（示例数据都在这之前），接后端时换成真实日期
    // 时间范围的起止日期（都按 YYYY-MM-DD 字符串比较，用 UTC 计算避免时区把日期算偏一天）：
    //   本周 = 本周一 ~ 今天；本月 = 本月 1 日 ~ 今天；上月 = 上月 1 日 ~ 上月最后一天
    const RANGE = (() => {
      const t = new Date(TODAY + 'T00:00:00Z');
      const s = (d) => d.toISOString().slice(0, 10);
      const y = t.getUTCFullYear(), m = t.getUTCMonth();
      const dow = (t.getUTCDay() + 6) % 7;   // 周一 = 0 … 周日 = 6
      return {
        week:      [s(new Date(Date.UTC(y, m, t.getUTCDate() - dow))), TODAY],
        month:     [s(new Date(Date.UTC(y, m, 1))), TODAY],
        lastMonth: [s(new Date(Date.UTC(y, m - 1, 1))), s(new Date(Date.UTC(y, m, 0)))],   // 本月 0 日 = 上月最后一天
      };
    })();

    // 输入框：只记到 _draft；画布里要 forceUpdate 才能看到打的字，demo 页面里不用刷新
    const typing = (key) => (e) => { draft[key] = e.target.value; if (typeof this.forceUpdate === 'function') this.forceUpdate(); };
    const inKw = typing('kw'), inFrom = typing('from'), inTo = typing('to'), inField = typing('field');
    // 日期检查：必须是 YYYY-MM-DD 且是真实存在的日期；开始不能晚于结束
    const isDate = (v) => /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(new Date(v)) && new Date(v).toISOString().slice(0, 10) === v;
    const checkDates = () => {
      if ((draft.from && !isDate(draft.from)) || (draft.to && !isDate(draft.to))) return '日期格式应为 YYYY-MM-DD，例如 2026-09-01';
      if (draft.from && draft.to && draft.from > draft.to) return '开始日期不能晚于结束日期';
      return '';
    };
    // 点"筛选"：先检查日期，有错就提示、不筛选；没错时输入项生效（填了指定日期，时间范围的点选项自动取消）
    const doQuery = () => {
      const err = checkDates();
      if (err) { this.setState({ dateErr: err }); return; }
      this.setState({ dateErr: '', applied: { ...draft }, time: (draft.from || draft.to) ? 'custom' : (st.time || 'all') });
    };
    // 日历图标：弹出旁边隐藏的系统日期选择器（不支持 showPicker 的浏览器退回 focus + click）
    const openPicker = (e) => {
      const picker = e.currentTarget.nextElementSibling;
      try { picker.showPicker(); } catch (_) { picker.focus(); picker.click(); }
    };
    // 日期选择器选好后：值本身就是 YYYY-MM-DD，写进文本框并刷新显示
    const pickedFrom = (e) => { draft.from = e.target.value; this.setState({ dateErr: '' }); };
    const pickedTo   = (e) => { draft.to = e.target.value; this.setState({ dateErr: '' }); };
    const dateErr = st.dateErr || '';
    const hasDateErr = dateErr !== '';
    // 点"重置"：所有条件回到默认
    const doReset = () => { this._draft = { ...Q_EMPTY }; this.setState({ applied: Q_EMPTY, actq: 'all', reasonq: 'all', osq: 'all', time: 'all', dateErr: '' }); };

    // 生成一组点选项：选中的蓝框白底蓝字，点了立刻筛选
    const chips = (key, opts, extra) => opts.map(([value, label]) => {
      const on = (st[key] || 'all') === value;
      return { label, pressed: on ? 'true' : 'false', border: on ? '#1e88e5' : 'transparent', bg: on ? '#ffffff' : 'transparent', color: on ? '#1e88e5' : '#333333',
        pick: () => this.setState({ [key]: value, ...(extra ? extra(value) : {}) }) };
    });
    // 时间范围的点选项：点了就清掉指定日期（两者只取一个）
    const clearDates = () => { draft.from = ''; draft.to = ''; return { applied: { ...applied, from: '', to: '' }, dateErr: '' }; };
    // 不提供「进程名称」：库里没有单独的进程名称字段，名称是从进程路径取的，按名称搜就是按路径搜
    const fieldOpts = [['path', '进程路径'], ['md5', '文件哈希'], ['host', '终端名称'], ['ip', 'IP地址']].map(([value, label]) => ({ value, label, sel: draft.field === value }));
    const kwPlaceholder = '请输入关键字';

    // 面板展开 / 折叠（页面加载时默认折叠）
    const advOpen = st.advOpen !== undefined ? st.advOpen : false;
    const toggleAdv = () => this.setState({ advOpen: !advOpen });
    const advExpanded = advOpen ? 'true' : 'false';
    const advColor = advOpen ? '#1e88e5' : '#4a5568';
    const advDeg = advOpen ? 180 : 0;
    // 审计日志列表的点选条件
    const actChips    = chips('actq', [['all', '全部'], ['已拦截', '已拦截'], ['告警', '告警']]);
    const reasonChips = chips('reasonq', [['all', '全部'], ['不在白名单', '不在白名单'], ['在黑名单', '在黑名单']]);
    // 系统类型：点选平铺，点了立刻筛选；「Linux/信创」= CentOS / Ubuntu 及麒麟、统信等所有非 Windows 系统
    const osChips     = chips('osq', [['all', '全部'], ['Windows', 'Windows'], ['Linux', 'Linux/信创']]);
    const timeChips   = chips('time', [['all', '全部'], ['week', '本周'], ['month', '本月'], ['lastMonth', '上月']], clearDates);

    const all = raw.map((r, i) => {
      const action = actionOf(r);
      return {
        ...r,
        date: r.at.slice(0, 10), time: r.at.slice(11),   // 日期 / 时分秒（列表里拼成一行显示）
        osIcon: r.os.indexOf('Windows') === 0 ? WIN : LNX,
        reasonBd: REASON[r.reason].bd, reasonBg: REASON[r.reason].bg, reasonColor: REASON[r.reason].color,
        action, actBg: ACTION[action].bg, actColor: ACTION[action].color,
        // 能不能加白 / 加黑（弹窗里按这个算"不适用"条数）：
        //   已在黑名单的不能再加黑；拦截模式 + 在黑名单 = 已按黑名单拦掉，是预期结果，也不加白
        canWhite: !(r.mode === '拦截' && r.reason === '在黑名单'),
        canBlack: r.reason !== '在黑名单',
        id: i,
        checked: selIds.indexOf(i) >= 0,                                     // 这一行是否勾选
        toggleSel: () => this.setState({ sel: selIds.indexOf(i) >= 0 ? selIds.filter((x) => x !== i) : selIds.concat([i]) }),
      };
    });
    // 按全部条件过滤（条件之间是"并且"关系）
    const qkw = applied.kw.trim().toLowerCase();
    const qtime = st.time || 'all';
    const rows = all.filter((r) => {
      const day = r.at.slice(0, 10);
      if ((st.actq || 'all') !== 'all' && r.action !== st.actq) return false;
      if ((st.reasonq || 'all') !== 'all' && r.reason !== st.reasonq) return false;
      if (curGroup !== '根管理组' && r.group !== curGroup) return false;   // 左侧选中的分组
      const osq = st.osq || 'all';
      if (osq === 'Windows' && r.os !== 'Windows') return false;
      if (osq === 'Linux' && r.os === 'Windows') return false;   // Linux：CentOS / Ubuntu 都算
      if (RANGE[qtime] && (day < RANGE[qtime][0] || day > RANGE[qtime][1])) return false;   // 时间范围：本周 / 本月 / 上月
      if (applied.from && day < applied.from) return false;
      if (applied.to && day > applied.to) return false;
      if (qkw && !String(r[applied.field] || '').toLowerCase().includes(qkw)) return false;   // 选中的那一列包含关键字
      return true;
    });
    const isEmpty = rows.length === 0;

    // ---------- 多选 + 批量加白 / 加黑 ----------
    const selRows = all.filter((r) => selIds.indexOf(r.id) >= 0);
    const selCount = selRows.length;
    // （全选 / 取消全选 只作用于当前页，放在下面分页算完之后）
    // ---------- 选中加白 / 选中加黑：先弹出「选择白名单 / 选择黑名单」弹窗（和进程管控列表一致） ----------
    // state.pk = { kind: 'w' 白名单 / 'b' 黑名单 }，null = 没打开；state.pkSel = 弹窗里勾选的名单
    // 名单按系统类型区分：勾选的日志必须同属 Windows 或同属 Linux/信创，弹窗里只列出这一类的名单
    const selCats = selRows.map((r) => osCat(r.os)).filter((v, k, a) => a.indexOf(v) === k);
    const pkSt = st.pk || null;
    const pkSel = st.pkSel || [];
    const pkKind = pkSt ? pkSt.kind : 'w';
    const pkName = pkKind === 'w' ? '白名单' : '黑名单';
    const pkCat = selCats[0] || 'Windows';
    const pkAll = listsOf(pkKind, pkCat);
    const canKey = pkKind === 'w' ? 'canWhite' : 'canBlack';
    const pkOk = selRows.filter((r) => r[canKey]).length;   // 适用的条数（已在黑名单的不能再加黑；拦截模式下在黑名单的不加白）
    const pkSkip = selCount - pkOk;
    const openPick = (kind) => {
      const kindName = kind === 'w' ? '白名单' : '黑名单';
      if (!selCount) return showToast('请先勾选要加入' + kindName + '的日志');
      if (selCats.length > 1) return showToast('所选日志里既有 Windows 又有 Linux/信创，名单按系统类型区分，请分开加入');
      this.setState({ pk: { kind }, pkSel: [], pkNew: null });
    };
    const act = { white: () => openPick('w'), black: () => openPick('b') };
    const quote = (names) => '「' + names.join('」「') + '」';   // 名单名加书名号，多个连着写
    const pk = {
      open: !!pkSt,
      title: '选择' + pkName + '（' + pkCat + '）',   // 例：选择白名单（Linux/信创）；列表只含这一类名单，所以列表项不再逐个标系统类型
      desc: '将已勾选的 ' + selCount + ' 条日志的进程加入以下' + pkName + '：',
      items: pkAll.map((label) => ({
        label,
        on: pkSel.indexOf(label) >= 0,
        toggle: () => this.setState({ pkSel: pkSel.indexOf(label) >= 0 ? pkSel.filter((x) => x !== label) : pkSel.concat(label) }),
      })),
      hint: '可多选；加入规则为「路径 + 文件哈希」' + (pkSkip ? '；其中 ' + pkSkip + ' 条不适用（如已在黑名单），会自动跳过' : ''),
      newText: '创建' + pkName,
      newOpen: () => { this._nfText = { name: '', note: '' }; this.setState({ pkNew: { os: pkCat } }); },   // 系统类型默认带入所选日志的
      close: () => this.setState({ pk: null, pkNew: null }),
      ok: () => {
        if (!pkSel.length) return showToast('请至少选择一个' + pkName);
        if (!pkOk) return showToast('所选日志都不适用' + (pkKind === 'w' ? '加白' : '加黑'));
        this.setState({ pk: null, pkNew: null, sel: [] });
        showToast('已将 ' + pkOk + ' 条日志的进程加入' + pkName + quote(pkSel) + (pkSkip ? '，跳过 ' + pkSkip + ' 条不适用的' : ''));
      },
    };
    // ---------- 创建白名单 / 黑名单：state.pkNew = { name, os, note }，null = 没打开 ----------
    // 名称 / 备注：打字时只记到 this._nfText，不重绘（和高级搜索关键字框同一种做法）；系统类型下拉选了才重绘
    const nfD = st.pkNew || null;
    if (!this._nfText) this._nfText = { name: '', note: '' };
    const nfText = this._nfText;
    const typeNf = (k) => (e) => { nfText[k] = e.target.value; };
    const setNf = (k) => (e) => this.setState({ pkNew: { ...nfD, [k]: e.target.value } });
    const nf = {
      open: !!(pkSt && nfD),
      title: '创建' + pkName,
      nameLabel: pkName + '名称',
      namePh: '示例：' + (pkKind === 'w' ? '办公区终端白名单' : '可疑工具黑名单'),
      d: { name: nfText.name, note: nfText.note },
      on: { name: typeNf('name'), os: setNf('os'), note: typeNf('note') },
      osOpts: OS_TYPES.map((t) => ({ v: t, t, sel: !!nfD && nfD.os === t })),
      osHint: '需和所选日志的系统类型（' + pkCat + '）一致',
      close: () => this.setState({ pkNew: null }),
      // 创建：名称必填、不能重名；系统类型要和所选日志一致；建好后出现在选择列表最后并自动勾上
      ok: () => {
        const name = String(nfText.name || '').trim();
        if (!name) return showToast('请输入' + pkName + '名称');
        if (LIST_META[name]) return showToast('已有同名' + pkName + '「' + name + '」');
        if (nfD.os !== pkCat) return showToast('系统类型需和所选日志一致（' + pkCat + '）');
        const d = new Date(), z = (n) => String(n).padStart(2, '0');
        const now = d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
        this.setState({ newMeta: { ...(st.newMeta || {}), [name]: [nfD.os, now, pkKind] }, pkSel: pkSel.concat(name), pkNew: null });
        showToast('已创建' + pkName + '「' + name + '」');
      },
    };
    const allTotal = all.length;
    const filtering = rows.length !== all.length;

    // ---------- 分页 ----------
    // state.size 每页条数（默认 10）；state.page 当前页；state.pageSig 记录翻页时的查询条件，条件变了就回到第 1 页
    const SIZES = [10, 20, 50];
    const size = st.size || 10;
    const pages = Math.max(1, Math.ceil(rows.length / size));            // 总页数（没数据也算 1 页）
    const sig = JSON.stringify([curGroup, applied, st.actq, st.reasonq, st.osq, st.time, size]);
    const page = Math.min(st.pageSig === sig ? (st.page || 1) : 1, pages);
    const goPage = (n) => this.setState({ page: Math.max(1, Math.min(pages, n)), pageSig: sig });
    const pageRows = rows.slice((page - 1) * size, page * size);          // 当前页的日志
    const pageBtns = Array.from({ length: pages }, (_, k) => k + 1).map((n) => ({
      n, cls: n === page ? 'on' : '', cur: n === page ? 'page' : false, go: () => goPage(n),
    }));
    const prevPage = () => goPage(page - 1), nextPage = () => goPage(page + 1);
    const noPrev = page <= 1, noNext = page >= pages;                   // 第一页 / 最后一页时按钮变灰
    const sizeOpts = SIZES.map((v) => ({ value: String(v), label: String(v), sel: v === size }));
    const pickSize = (e) => this.setState({ size: Number(e.target.value), page: 1 });
    // 跳页：输入页码按回车；超出范围自动取第一页 / 最后一页
    const jumpKey = (e) => {
      if (e.key !== 'Enter') return;
      const n = parseInt(e.target.value, 10);
      e.target.value = '';
      if (!isNaN(n)) goPage(n);
    };

    // 表头全选框：只管当前页（其他页已勾的保留）
    const allChecked = pageRows.length > 0 && pageRows.every((r) => selIds.indexOf(r.id) >= 0);
    const toggleAll = () => {
      const ids = pageRows.map((r) => r.id);
      this.setState({ sel: allChecked ? selIds.filter((x) => ids.indexOf(x) < 0) : selIds.concat(ids.filter((x) => selIds.indexOf(x) < 0)) });
    };

    // 底部统计（按全部符合条件的日志算，不只当前页）
    const total = rows.length;
    const nBlocked = rows.filter((r) => r.action === '已拦截').length;
    const nPass = rows.filter((r) => r.action === '告警').length;

    return { pageRows, pageBtns, prevPage, nextPage, noPrev, noNext, sizeOpts, pickSize, jumpKey, act, pk, nf, selCount, allChecked, toggleAll, menus, groups, groupOnline, groupTotal, rows, actChips, reasonChips, osChips, advOpen, toggleAdv, advExpanded, advColor, advDeg, draft, inKw, inFrom, inTo, inField, openPicker, pickedFrom, pickedTo, dateErr, hasDateErr, doQuery, doReset, fieldOpts, kwPlaceholder, timeChips, isEmpty, allTotal, filtering, toast, toastOn, total, nBlocked, nPass };
  }
}

</script>
