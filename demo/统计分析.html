<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>进程管控 - 统计分析</title>
<style>

/* 页面基础：系统中文字体，灰底 */
body{margin:0;font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#f0f2f5}
/* 链接颜色和学习任务列表页一致 */
a{color:#1e88e5;text-decoration:none}a:hover{color:#1565c0}
/* 左侧导航：悬停效果（截图 14）—— 底色变亮一点的深蓝、左侧出现亮蓝竖条、文字变白；一级菜单的图标变亮蓝 */
.nav1:hover,.nav2:hover{background:#0d3479 !important;border-left-color:#08a7ff !important;color:#ffffff !important}
.nav1:hover .nav-ico{color:#33b8ff !important}

/* ===== 概览页 ===== */
/* 面板：白底细边框，标题栏 */
.panel{display:flex;flex-direction:column;background:#ffffff;border:1px solid #e3e6eb;min-height:0}
.panel-hd{display:flex;align-items:center;justify-content:space-between;height:40px;flex-shrink:0;padding:0 14px;border-bottom:1px solid #eef0f3}
.panel-tt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#1f2d3d}
.panel-tt::before{content:"";width:3px;height:14px;background:#1e88e5}
.more{font-size:12px;color:#1e88e5}
/* 指标卡：整张可点，悬停边框变蓝 */
.kpi{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 18px;background:#ffffff;border:1px solid #e3e6eb;border-left:3px solid #1e88e5;color:#333333}
.kpi:hover{border-color:#1e88e5;color:#333333}
/* 时间范围按钮 */
.rng{height:26px;padding:0 12px;border:1px solid #d5d9e0;background:#ffffff;border-radius:2px;font-size:13px;color:#333333;cursor:pointer;font-family:inherit}
.rng:hover{border-color:#1e88e5;color:#1e88e5}
/* 待处理事项 / TOP 榜 / 最近事件：行悬停 */
.orow:hover{background:#f4f8fd}
/* 柱状图：悬停高亮当前这一天 */
.bar-col:hover .bar{filter:brightness(0.85)}
.bar-col:hover .bar-x{color:#1e88e5;font-weight:700}
/* 小按钮（加白）*/
.mini{height:22px;padding:0 8px;border:1px solid #d5d9e0;background:#ffffff;border-radius:2px;font-size:12px;color:#333333;cursor:pointer;font-family:inherit;white-space:nowrap}
.mini:hover{border-color:#1e88e5;color:#1e88e5}

/* 独立页面：页面固定 1920×1080，窗口小时可以滚动 */
html,body{margin:0}
</style>
</head>
<body>
<!-- 渲染结果放这里 -->
<div id="app"></div>

<!-- 页面模板（和设计稿一致） -->
<template id="page-tpl">


<!-- ============ 整个页面：固定 1920 x 1080（外壳与「学习任务列表」页一致） ============ -->
<div style="position: relative; width: 1920px; height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; background: #f0f2f5; color: #333333; font-size: 14px; overflow: hidden;">

  <!-- ============ 顶栏（50px 高） ============ -->
  <div style="height: 50px; flex-shrink: 0; display: flex; align-items: stretch; background: #ffffff; border-bottom: 1px solid #e3e6eb;">
    <!-- 左上角 LOGO 区：深蓝底 -->
    <div style="width: 180px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #0f2a5c; color: #ffffff; font-size: 22px; font-weight: 800; letter-spacing: 2px;">SOC</div>
    <!-- 系统标题 -->
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 20px; flex-grow: 1;">
      <span style="font-size: 18px; font-weight: 700; color: #1f2d3d;">终端威胁检测与响应系统</span>
      <span style="font-size: 14px; color: #1f2d3d;">· 专用</span>
      <span style="font-size: 13px; color: #8a94a6; font-style: italic; margin-left: 12px;">一切尽在掌握！</span>
    </div>
    <!-- 右侧：消息数 / 用户 / 下载 -->
    <div style="display: flex; align-items: center; gap: 16px; padding: 0 20px;">
      <div style="display: flex; align-items: center; gap: 6px; background: #f2f4f7; border-radius: 4px; padding: 4px 10px; color: #4a5568;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
        <span>101</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: #f2f4f7; border-radius: 16px; padding: 4px 12px 4px 6px; color: #4a5568;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e88e5" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
        <span>optAdmin</span>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #1e88e5; display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6"></path></svg>
      </div>
    </div>
  </div>

  <!-- ============ 顶栏以下：左导航 + 右侧内容 ============ -->
  <div style="flex-grow: 1; display: flex; min-height: 0;">

    <!-- ============ 左侧主导航（180px，深蓝；当前高亮：进程管控） ============ -->
    <nav style="width: 180px; flex-shrink: 0; background: #0f2a5c; color: #ffffff; display: flex; flex-direction: column; padding-top: 6px;">
      <div style="display: flex; flex-direction: column;">
        <template data-sc="for" list="{{ menus }}" as="m" hint-placeholder-count="19">
          <!-- 一级菜单：普通状态浅色文字；选中 / 悬停时底色变亮、左侧亮蓝竖条、文字变白、图标变亮蓝（截图 13 / 14）
               有二级菜单的在右边显示箭头（展开朝上、收起朝下），点击展开 / 收起 -->
          <a href="#" class="nav1" onClick="{{ m.toggle }}" aria-expanded="{{ m.expanded }}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 0 0 34px; box-sizing: border-box; color: {{ m.fg }}; font-size: 14px; background: {{ m.bg }}; border-left: 3px solid {{ m.bar }};">
            <span class="nav-ico" style="display: flex; color: {{ m.icoColor }};"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ m.icon }}"></path></svg></span>
            <span style="flex-grow: 1;">{{ m.label }}</span>
            <template data-sc="if" value="{{ m.hasSub }}" hint-placeholder-val="{{ false }}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 16px; transform: rotate({{ m.caret }});"><path d="M6 9l6 6 6-6"></path></svg>
            </template>
          </a>
          <!-- 二级菜单：缩进，前面一个小圆点（截图 13）；当前页面：底色变亮 + 左侧亮蓝竖条 + 白字 + 亮蓝圆点；悬停同样效果（截图 14） -->
          <template data-sc="if" value="{{ m.expanded }}" hint-placeholder-val="{{ false }}">
            <template data-sc="for" list="{{ m.children }}" as="c" hint-placeholder-count="5">
              <a href="{{ c.href }}" class="nav2" aria-current="{{ c.current }}" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 0 0 65px; box-sizing: border-box; color: {{ c.fg }}; font-size: 14px; background: {{ c.bg }}; border-left: 3px solid {{ c.bar }};">
                <span style="width: 5px; height: 5px; border-radius: 50%; background: {{ c.dot }}; flex-shrink: 0;"></span>
                <span>{{ c.label }}</span>
              </a>
            </template>
          </template>
        </template>
      </div>
      <!-- 底部版权信息 -->
      <div style="margin-top: auto; padding: 14px 10px 12px; border-top: 1px solid #1d3f7d; text-align: center; font-size: 12px; line-height: 18px; color: #c5d0e3;">
        <div>[公司名称]</div>
        <div>版权所有</div>
        <div>版本：3.0 build：305034</div>
      </div>
    </nav>

    <!-- ============ 右侧主内容区 ============ -->
    <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; margin: 12px; background: #ffffff; border: 1px solid #e3e6eb;">

      <!-- 页签：进程管控概览下 3 个页签 概览 / 日志 / 策略（当前选中：无）；统计分析页已不在页签里（页面保留）；其他页面都在左侧二级菜单里
           选中的页签：白底 + 顶部蓝线 + 蓝字 -->
      <div style="display: flex; align-items: stretch; height: 44px; flex-shrink: 0; background: #f5f7fa; border-bottom: 1px solid #e3e6eb;">
        <a href="概览.html" style="width: 116px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #e3e6eb; color: #333333; font-size: 15px;">概览</a>
        <a href="审计日志列表.html" style="width: 116px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #e3e6eb; color: #333333; font-size: 15px;">日志</a>
        <a href="策略详情.html" style="width: 116px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #e3e6eb; color: #333333; font-size: 15px;">策略</a>
      </div>

      <!-- ============ 内容区：统计分析 ============
           设计思路（管理员进来第一眼要回答的 4 个问题）：
             1. 管控开到什么程度了？—— 指标卡 + 终端管控模式分布
             2. 现在有没有事要我处理？—— 待处理事项（按严重程度排序，每条直达对应页面）
             3. 拦截情况正常吗、趋势如何？—— 拦截趋势图 + 最近拦截事件
             4. 谁最不老实？—— 拦截最多的进程 / 终端 TOP5，可直接加白
           指标口径：时间范围（今日 / 近 7 天 / 近 30 天）作用于 已拦截、放行、趋势图、TOP 榜、最近事件；
                     终端数、待确认、未知进程是"当前状态"，不随时间范围变。 -->
      <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 14px; background: #f5f7fa;">

        <!-- 第一行：标题 + 时间范围 + 更新时间 -->
        <div style="display: flex; align-items: center; justify-content: space-between; height: 30px; flex-shrink: 0;">
          <div style="display: flex; align-items: center; gap: 14px;">
            <span style="font-size: 16px; font-weight: 700; color: #1f2d3d;">进程管控统计分析</span>
            <span style="font-size: 12px; color: #8a94a6;">统计时间：{{ rangeText }}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 14px;">
            <!-- 时间范围：选中的蓝底白字 -->
            <div style="display: flex; gap: 0;">
              <template data-sc="for" list="{{ ranges }}" as="r" hint-placeholder-count="3">
                <button class="rng" onClick="{{ r.pick }}" aria-pressed="{{ r.on }}" style="background: {{ r.bg }}; color: {{ r.fg }}; border-color: {{ r.bd }}; margin-left: -1px;">{{ r.label }}</button>
              </template>
            </div>
            <span style="font-size: 12px; color: #8a94a6;">数据更新于 {{ updatedAt }}</span>
            <button aria-label="刷新" style="width: 26px; height: 26px; border: 0; background: transparent; cursor: pointer; color: #4a5568; display: flex; align-items: center; justify-content: center;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>
            </button>
          </div>
        </div>

        <!-- 第二行：6 张指标卡（整张卡可点，跳到对应页面）-->
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; height: 92px; flex-shrink: 0;">
          <template data-sc="for" list="{{ kpis }}" as="k" hint-placeholder-count="6">
            <a href="{{ k.href }}" class="kpi" style="border-left-color: {{ k.color }};">
              <div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #5a6475;">
                <span>{{ k.label }}</span>
                <span style="font-size: 12px; color: #8a94a6;">{{ k.hint }}</span>
              </div>
              <div style="display: flex; align-items: baseline; gap: 6px;">
                <span style="font-size: 28px; font-weight: 700; line-height: 1; color: {{ k.color }};">{{ k.value }}</span>
                <span style="font-size: 13px; color: #5a6475;">{{ k.unit }}</span>
                <span style="margin-left: auto; font-size: 12px; color: {{ k.deltaColor }};">{{ k.delta }}</span>
              </div>
              <div style="font-size: 12px; color: #8a94a6;">{{ k.sub }}</div>
            </a>
          </template>
        </div>

        <!-- 第三行：待处理事项 | 拦截趋势 | 模式分布 + 名单概况 -->
        <div style="display: flex; gap: 12px; height: 360px; flex-shrink: 0;">

          <!-- 待处理事项：按严重程度排序，每条一个入口 -->
          <div class="panel" style="width: 560px; flex-shrink: 0;">
            <div class="panel-hd">
              <span class="panel-tt">待处理事项<span style="font-weight: 400; color: #8a94a6; font-size: 12px;">共 {{ todoCount }} 项</span></span>
              <span style="display: flex; gap: 10px; font-size: 12px; color: #8a94a6;">
                <span><i style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c62828; margin-right: 4px;"></i>紧急</span>
                <span><i style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef8f00; margin-right: 4px;"></i>重要</span>
                <span><i style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #1e88e5; margin-right: 4px;"></i>一般</span>
              </span>
            </div>
            <div style="display: flex; flex-direction: column; overflow: hidden;">
              <template data-sc="for" list="{{ todos }}" as="t" hint-placeholder-count="6">
                <div class="orow" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid #f0f2f5;">
                  <i style="width: 8px; height: 8px; border-radius: 50%; background: {{ t.color }}; flex-shrink: 0;"></i>
                  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
                    <span style="font-size: 13px; color: #1f2d3d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ t.title }}</span>
                    <span style="font-size: 12px; color: #8a94a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ t.detail }}</span>
                  </div>
                  <span style="font-size: 18px; font-weight: 700; color: {{ t.color }}; flex-shrink: 0;">{{ t.count }}</span>
                  <a href="{{ t.href }}" style="flex-shrink: 0; font-size: 12px; white-space: nowrap;">{{ t.action }} ›</a>
                </div>
              </template>
            </div>
          </div>

          <!-- 拦截趋势：分组柱状图（已拦截 = 拦截模式命中 / 放行 = 审计模式命中只记录），今日按小时、7 天 / 30 天按天
               口径和审计日志一致：只统计「不在白名单」或「在黑名单」的进程，白名单里的进程不产生日志、也不计数 -->
          <div class="panel" style="flex-grow: 1; min-width: 0;">
            <div class="panel-hd">
              <span class="panel-tt">拦截趋势<span style="font-weight: 400; color: #8a94a6; font-size: 12px;">{{ trendUnit }}</span></span>
              <span style="display: flex; gap: 14px; font-size: 12px; color: #5a6475;">
                <span><i style="display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: #c62828; margin-right: 5px; vertical-align: -1px;"></i>已拦截 {{ sumBlocked }}</span>
                <span><i style="display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: #ef8f00; margin-right: 5px; vertical-align: -1px;"></i>放行（审计模式）{{ sumShould }}</span>
              </span>
            </div>
            <div style="flex-grow: 1; min-height: 0; display: flex; padding: 12px 14px 8px 8px;">
              <!-- 纵轴刻度 -->
              <div style="width: 30px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: #8a94a6; text-align: right; padding-right: 6px; padding-bottom: 18px;">
                <span>{{ yMax }}</span><span>{{ yMid }}</span><span>0</span>
              </div>
              <!-- 柱子：每个时间点一列，列里两根柱（已拦截 红 / 放行 橙），鼠标悬停显示数值（title）-->
              <div style="flex-grow: 1; min-width: 0; display: flex; align-items: stretch; border-left: 1px solid #e3e6eb; position: relative;">
                <div style="position: absolute; left: 0; right: 0; top: 0; border-top: 1px dashed #eceff3;"></div>
                <div style="position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed #eceff3;"></div>
                <template data-sc="for" list="{{ trend }}" as="d" hint-placeholder-count="30">
                  <div class="bar-col" title="{{ d.tip }}" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 0; padding: 0 {{ colPad }}px; box-sizing: border-box; height: 100%;">
                    <div style="display: flex; align-items: flex-end; gap: 2px; width: 100%; height: calc(100% - 18px); justify-content: center;">
                      <div class="bar" style="width: {{ barW }}px; height: {{ d.hBlocked }}%; background: #c62828; border-radius: 2px 2px 0 0; min-height: {{ d.minBlocked }}px;"></div>
                      <div class="bar" style="width: {{ barW }}px; height: {{ d.hShould }}%; background: #ef8f00; border-radius: 2px 2px 0 0; min-height: {{ d.minShould }}px;"></div>
                    </div>
                    <span class="bar-x" style="height: 18px; line-height: 18px; font-size: 11px; color: #8a94a6; white-space: nowrap;">{{ d.label }}</span>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- 终端管控模式分布 + 名单概况 -->
          <div style="width: 400px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px;">
            <div class="panel" style="flex-grow: 1;">
              <div class="panel-hd">
                <span class="panel-tt">终端管控模式分布</span>
                <a href="{{ links.policy }}" class="more">策略设置 ›</a>
              </div>
              <div style="padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 12px;">
                <!-- 一根横向堆叠条，段宽按终端数比例 -->
                <div style="display: flex; height: 14px; border-radius: 3px; overflow: hidden; gap: 2px;">
                  <template data-sc="for" list="{{ modes }}" as="m" hint-placeholder-count="4">
                    <div title="{{ m.label }} {{ m.count }} 台" style="width: {{ m.pct }}%; background: {{ m.color }};"></div>
                  </template>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                  <template data-sc="for" list="{{ modes }}" as="m" hint-placeholder-count="4">
                    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; height: 22px;">
                      <i style="width: 10px; height: 10px; border-radius: 2px; background: {{ m.color }}; flex-shrink: 0;"></i>
                      <span style="width: 64px; color: #333333;">{{ m.label }}</span>
                      <span style="width: 56px; text-align: right; font-weight: 700; color: #1f2d3d;">{{ m.count }} 台</span>
                      <span style="width: 44px; text-align: right; color: #8a94a6; font-size: 12px;">{{ m.pct }}%</span>
                      <span style="color: #8a94a6; font-size: 12px; margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ m.note }}</span>
                    </div>
                  </template>
                </div>
              </div>
            </div>
            <div class="panel" style="height: 120px; flex-shrink: 0;">
              <div class="panel-hd">
                <span class="panel-tt">名单概况</span>
              </div>
              <div style="display: flex; align-items: center; justify-content: space-around; flex-grow: 1; padding: 0 8px;">
                <template data-sc="for" list="{{ lists }}" as="l" hint-placeholder-count="2">
                  <a href="{{ l.href }}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #333333;">
                    <span style="font-size: 12px; color: #5a6475;">{{ l.label }}</span>
                    <span style="font-size: 22px; font-weight: 700; color: {{ l.color }}; line-height: 1;">{{ l.count }}<span style="font-size: 12px; font-weight: 400; color: #5a6475; margin-left: 3px;">个</span></span>
                    <span style="font-size: 12px; color: #8a94a6;">{{ l.sub }}</span>
                  </a>
                </template>
              </div>
            </div>
          </div>
        </div>

        <!-- 第四行：拦截 TOP 进程 | 拦截 TOP 终端 | 最近拦截事件 -->
        <div style="display: flex; gap: 12px; flex-grow: 1; min-height: 0;">

          <!-- 拦截最多的进程 TOP5（已拦截 + 审计模式放行）：可直接加白（误拦最常见的处理）-->
          <div class="panel" style="width: 560px; flex-shrink: 0;">
            <div class="panel-hd">
              <span class="panel-tt">拦截最多的进程<span style="font-weight: 400; color: #8a94a6; font-size: 12px;">TOP 5 · 含审计模式放行</span></span>

<script>
// 页面属性的默认值（设计稿右侧属性面板里的那些开关）
const PROP_DEFS = {"$preview": {"width": 1920, "height": 1080}};

// ======================================================================
// 小渲染器：替代设计工具的运行时，让页面脱离设计工具也能直接打开
// 支持：{{ a.b }} 取值、<template data-sc="for"> 循环、<template data-sc="if"> 条件、
//      onClick / onChange 事件、setState 后整页重新渲染
// ======================================================================

// 页面逻辑类的父类：提供 props（属性默认值）、state（页面状态）、setState（改状态并重绘）
class DCLogic {
  constructor(props) {
    this.props = props || {};
    this.state = {};
  }
  setState(patch) {
    Object.assign(this.state, patch);   // 合并新状态
    render();                           // 重新画整页
  }
}

// 按 "a.b.c" 从作用域里取值；true / false / 数字 这种字面量直接返回
function lookup(scope, path) {
  path = path.trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  let cur = scope;
  for (const key of path.split('.')) {
    if (cur == null) return undefined;
    cur = cur[key];
  }
  return cur;
}

const WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;   // 整个属性值就是一个 {{ }}（要保留原始类型，比如函数、布尔）
const PART = /\{\{([^}]+)\}\}/g;           // 字符串里夹着的 {{ }}

// 把字符串里的 {{ }} 都换成值
function interp(str, scope) {
  return str.replace(PART, (_, p) => {
    const v = lookup(scope, p);
    return v == null ? '' : String(v);
  });
}

// 递归渲染一个模板节点，结果追加到 parent 里
function renderNode(node, scope, parent) {
  // 文字节点：替换 {{ }}
  if (node.nodeType === 3) {
    parent.appendChild(document.createTextNode(interp(node.nodeValue, scope)));
    return;
  }
  if (node.nodeType !== 1) return;   // 注释等其他节点跳过

  // 循环：<template data-sc="for" list="{{ rows }}" as="r">
  if (node.tagName === 'TEMPLATE' && node.dataset.sc === 'for') {
    const list = lookup(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];
    const as = node.getAttribute('as');
    list.forEach((item, i) => {
      // 子作用域：继承外层，再加上当前这一项和序号
      const child = Object.create(scope);
      child[as] = item;
      child.$index = i;
      node.content.childNodes.forEach((n) => renderNode(n, child, parent));
    });
    return;
  }
  // 条件：<template data-sc="if" value="{{ x }}">，值为真才渲染里面的内容
  if (node.tagName === 'TEMPLATE' && node.dataset.sc === 'if') {
    const v = lookup(scope, node.getAttribute('value').replace(/[{}]/g, ''));
    if (v) node.content.childNodes.forEach((n) => renderNode(n, scope, parent));
    return;
  }

  // 普通元素：复制标签，逐个处理属性
  // 必须按原节点的命名空间创建：svg / path 这些图标属于 SVG 命名空间，
  // 用 createElement 建出来是"假的 svg"，浏览器不会画（之前小箭头、图标不显示就是这个原因）
  const el = node.namespaceURI === 'http://www.w3.org/1999/xhtml'
    ? document.createElement(node.localName)
    : document.createElementNS(node.namespaceURI, node.localName);
  const props = {};   // 要在插入后设置的属性（selected / checked / value）
  for (const attr of Array.from(node.attributes)) {
    const name = attr.name;
    const m = attr.value.match(WHOLE);
    if (m) {
      const v = lookup(scope, m[1]);
      if (name.startsWith('on')) {
        // 事件：onClick → click；链接 href="#" 的点击不跳页面
        if (typeof v === 'function') {
          el.addEventListener(name.slice(2).toLowerCase(), (e) => {
            if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
            v(e);
          });
        }
      } else if (name === 'checked' || name === 'selected' || name === 'value') {
        props[name] = v;                      // 这几个要用属性赋值才生效
      } else if (v === false || v == null) {
        // false / 空值：不写这个属性
      } else {
        el.setAttribute(name, String(v));
      }
    } else if (attr.value.indexOf('{{') >= 0) {
      el.setAttribute(name, interp(attr.value, scope));
    } else if (name === 'checked' || name === 'selected') {
      props[name] = true;                     // 写死的 checked / selected
    } else {
      el.setAttribute(name, attr.value);
    }
  }
  // 子节点（<template> 自己的内容在 .content 里）
  const kids = node.tagName === 'TEMPLATE' ? node.content.childNodes : node.childNodes;
  kids.forEach((n) => renderNode(n, scope, el));
  parent.appendChild(el);
  // 插入后再设置属性（option 的 selected 必须在进了 select 之后设）
  if ('value' in props) el.value = props.value == null ? '' : props.value;
  if ('checked' in props) el.checked = !!props.checked;
  if ('selected' in props) el.selected = !!props.selected;
}

let TPL = null;    // 页面模板（只解析一次）
let COMP = null;   // 页面逻辑实例

// 整页渲染：取最新数据 → 按模板生成 DOM → 替换掉旧的
function render() {
  const vals = COMP.renderVals();
  const root = document.getElementById('app');
  const frag = document.createDocumentFragment();
  TPL.content.childNodes.forEach((n) => renderNode(n, vals, frag));
  // 保留页面滚动位置，避免每次点击后跳回顶部
  const x = window.scrollX, y = window.scrollY;
  root.replaceChildren(frag);
  window.scrollTo(x, y);
}

// 启动：读模板、按属性默认值创建页面逻辑、第一次渲染
window.addEventListener('DOMContentLoaded', () => {
  TPL = document.getElementById('page-tpl');

    if (cfg && typeof cfg === 'object' && 'default' in cfg) defaults[k] = cfg.default;
  }
  COMP = new Component(defaults);
  render();
});
