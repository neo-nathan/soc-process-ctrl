<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>进程管控 - 进程管控列表</title>
<style>
/* 所有元素的宽度都按"含内边距"计算，表格列的 width 才是真实占位宽度，不会被 padding 撑宽而溢出 */
*{box-sizing:border-box}
/* 页面基础样式：去掉默认外边距，字体用系统中文字体 */
body{margin:0;font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#f0f2f5}
/* 链接颜色：参考截图里的蓝色 */
a{color:#1e88e5;text-decoration:none}a:hover{color:#1565c0}
/* 表格行悬停时浅蓝底色 */
.row:hover{background:#f4f8fd}
/* 表格里超长文字（路径、命令行）单行省略 */
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 复选框统一大小 */
input[type=checkbox]{width:14px;height:14px;margin:0;accent-color:#1e88e5}
/* 系统类型筛选框：下拉展开后的选项文字用正常深色 */
#os-filter option{color:#333333}
/* 左侧导航：悬停效果（截图 14）—— 底色变亮一点的深蓝、左侧出现亮蓝竖条、文字变白；一级菜单的图标变亮蓝 */
.nav1:hover,.nav2:hover{background:#0d3479 !important;border-left-color:#08a7ff !important;color:#ffffff !important}
.nav1:hover .nav-ico{color:#33b8ff !important}
/* 导航条里的链接悬停 */
.crumb:hover{color:#1565c0 !important;text-decoration:underline}
/* 下拉 / 弹窗里的可勾选项（终端多选、选择名单）：悬停浅蓝底蓝字，按下底色再深一点（和审计日志列表一致） */
.mitem:hover{background:#eef4fc !important;color:#1e88e5 !important}
.mitem:active{background:#d6e6fa !important;color:#1565c0 !important}
/* 工具栏按钮悬停 */
.tbtn:hover{border-color:#1e88e5;color:#1e88e5}
/* 主按钮（查询）悬停 */
.pbtn:hover{background:#1565c0}
/* 弹窗表单：输入框 / 下拉 / 多行文本 统一外观（和学习任务列表一致） */
.fi{box-sizing:border-box;width:100%;height:32px;padding:0 10px;font-family:inherit;font-size:13px;color:#333333;background:#ffffff;border:1px solid #d5d9e0;border-radius:3px}
.fi:focus{outline:none;border-color:#1e88e5}
.fi::placeholder{color:#b0b8c4}
textarea.fi{height:64px;padding:8px 10px;resize:none}
/* 取消按钮悬停 */
.cbtn:hover{border-color:#1e88e5;color:#1e88e5}
/* 系统类型筛选框获得焦点时蓝色描边 */
#os-filter:focus{outline:none;border-color:#1e88e5}

/* 独立页面：页面固定 1920×1080，窗口小时可以滚动 */
html,body{margin:0}
</style>
</head>
<body>
<!-- 渲染结果放这里 -->
<div id="app"></div>

<!-- 页面模板（和设计稿一致） -->
<template id="page-tpl">
<!-- ============ 整个页面：固定 1920 x 1080 ============ -->
<div style="position: relative; width: 1920px; height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; background: #f0f2f5; color: #333333; font-size: 14px; overflow: hidden; position: relative;">

  <!-- ============ 顶栏（50px 高） ============ -->
  <div style="height: 50px; flex-shrink: 0; display: flex; align-items: stretch; background: #ffffff; border-bottom: 1px solid #e3e6eb;">
    <!-- 左上角 LOGO 区：深蓝底 -->
    <div style="width: 180px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #0f2a5c; color: #ffffff; font-size: 22px; font-weight: 800; letter-spacing: 2px;">
      SOC
    </div>
    <!-- 系统标题 -->
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 20px; flex-grow: 1;">
      <span style="font-size: 18px; font-weight: 700; color: #1f2d3d;">终端威胁检测与响应系统</span>
      <span style="font-size: 14px; color: #1f2d3d;">· 专用</span>
      <span style="font-size: 13px; color: #8a94a6; font-style: italic; margin-left: 12px;">一切尽在掌握！</span>
    </div>
    <!-- 右侧：消息数 / 用户 / 下载 -->
    <div style="display: flex; align-items: center; gap: 16px; padding: 0 20px;">
      <div style="display: flex; align-items: center; gap: 6px; background: #f2f4f7; border-radius: 4px; padding: 4px 10px; color: #4a5568;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
        <span>101</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: #f2f4f7; border-radius: 16px; padding: 4px 12px 4px 6px; color: #4a5568;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e88e5" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
        <span>optAdmin</span>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #1e88e5; display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5"><path d="M12 4v12M6 11l6 6 6-6"></path></svg>
      </div>
    </div>
  </div><div style="flex-grow: 1; display: flex; min-height: 0;">

    <!-- ============ 左侧主导航（180px，深蓝） ============ -->
    <nav style="width: 180px; flex-shrink: 0; background: #0f2a5c; color: #ffffff; display: flex; flex-direction: column; padding-top: 6px;">
      <!-- 导航菜单列表：数据在下方脚本里，选中项高亮 -->
      <div style="display: flex; flex-direction: column;">
        <template data-sc="for" list="{{ menus }}" as="m" hint-placeholder-count="19">
          <!-- 一级菜单：普通状态浅色文字；选中 / 悬停时底色变亮、左侧亮蓝竖条、文字变白、图标变亮蓝（截图 13 / 14）
               有二级菜单的在右边显示箭头（展开朝上、收起朝下），点击展开 / 收起 -->
          <a href="#" class="nav1" onClick="{{ m.toggle }}" aria-expanded="{{ m.expanded }}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 0 0 34px; box-sizing: border-box; color: {{ m.fg }}; font-size: 14px; background: {{ m.bg }}; border-left: 3px solid {{ m.bar }};">
            <span class="nav-ico" style="display: flex; color: {{ m.icoColor }};"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ m.icon }}"></path></svg></span>
            <span style="flex-grow: 1;">{{ m.label }}</span>
            <template data-sc="if" value="{{ m.hasSub }}" hint-placeholder-val="{{ false }}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 16px; transform: rotate({{ m.caret }});"><path d="M6 9l6 6 6-6"></path></svg>
            </template>
          </a>
          <!-- 二级菜单：缩进，前面一个小圆点（截图 13）；当前页面：底色变亮 + 左侧亮蓝竖条 + 白字 + 亮蓝圆点；悬停：底色 + 竖条 + 白字（截图 14） -->
          <template data-sc="if" value="{{ m.expanded }}" hint-placeholder-val="{{ false }}">
            <template data-sc="for" list="{{ m.children }}" as="c" hint-placeholder-count="5">
              <a href="{{ c.href }}" class="nav2" aria-current="{{ c.current }}" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 0 0 65px; box-sizing: border-box; color: {{ c.fg }}; font-size: 14px; background: {{ c.bg }}; border-left: 3px solid {{ c.bar }};">
                <span style="width: 5px; height: 5px; border-radius: 50%; background: {{ c.dot }}; flex-shrink: 0;"></span>
                <span>{{ c.label }}</span>
              </a>
            </template>
          </template>
        </template>
      </div>
      <!-- 底部版权信息 -->
      <div style="margin-top: auto; padding: 14px 10px 12px; border-top: 1px solid #1d3f7d; text-align: center; font-size: 12px; line-height: 18px; color: #c5d0e3;">
        <div>[公司名称]</div>
        <div>版权所有</div>
        <div>版本：3.0 build：305034</div>
      </div>
    </nav>


    <!-- ============ 右侧主内容区 ============ -->
    <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; margin: 12px; background: #ffffff; border: 1px solid #e3e6eb;">

      <!-- 导航条（面包屑）：进程管控 / 进程管理。左侧导航有了二级菜单后，原来的顶部页签不再需要，换成导航条标明当前位置
           样式和「进程采集记录」页的导航条一致；「进程管控」可点（回到进程管控概览） -->
      <div style="display: flex; align-items: center; gap: 8px; height: 44px; flex-shrink: 0; padding: 0 16px; border-bottom: 1px solid #eef0f3; font-size: 14px; color: #8a94a6;">
        <a href="概览.html" class="crumb" style="color: #1e88e5;">进程管控</a>
        <span>/</span>
        <span aria-current="page" style="color: #1f2d3d;">进程管理</span>
      </div>

      <!-- 工具栏：只保留右侧的 高级搜索 / 刷新 / 列设置 -->
      <div style="display: flex; align-items: center; justify-content: flex-end; height: 44px; flex-shrink: 0; padding: 0 10px;">
        <div style="display: flex; align-items: center; gap: 18px; color: #4a5568;">
          <!-- 高级搜索：点击展开 / 折叠下方的查询面板；展开时文字变蓝、箭头朝上 -->
          <button onClick="{{ toggleAdv }}" aria-expanded="{{ advOpen }}" style="display: flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; cursor: pointer; font-family: inherit; font-size: 14px; color: {{ advColor }};">高级搜索
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform: rotate({{ advCaret }});"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <button aria-label="刷新" style="width: 28px; height: 28px; border: 0; background: transparent; cursor: pointer; color: #4a5568;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>
          </button>
          <button aria-label="列设置" style="width: 28px; height: 28px; border: 0; background: transparent; cursor: pointer; color: #4a5568;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M12 4v16M17 4v16"></path></svg>
          </button>
        </div>
      </div>

      <!-- 工具行：左边系统类型筛选 + 选中加白 / 选中加黑 / 按搜索条件加白 -->
      <div style="position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; height: 40px; flex-shrink: 0; padding: 0 10px;">
        <!-- 左上角：系统类型筛选下拉框 + 选中加白 / 选中加黑 + 按搜索条件加白 -->
        <div style="display: flex; align-items: center; gap: 12px;">
          <!-- 系统类型：只有 Windows / Linux/信创 两项，打开页面默认 Linux/信创；选了立刻生效 -->
          <select id="os-filter" aria-label="筛选系统类型" value="{{ fOs }}" onChange="{{ onOs }}" style="height: 28px; min-width: 180px; padding: 0 8px; border: 1px solid #d5d9e0; border-radius: 2px; background: #ffffff; color: #333333; font-size: 13px; font-family: inherit;">
            <template data-sc="for" list="{{ osTypes }}" as="t" hint-placeholder-count="2">
              <option value="{{ t }}">{{ t }}</option>
            </template>
          </select>
          <!-- 分隔竖线 -->
          <span style="width: 1px; height: 18px; background: #dde1e7; margin: 0 4px;"></span>
          <!-- 选中加白 / 选中加黑：把列表里勾选的进程（可跨页勾选）加入名单；点了先弹出「选择白名单 / 选择黑名单」弹窗 -->
          <button class="cbtn" style="display: flex; align-items: center; height: 30px; padding: 0 14px; background: #ffffff; border: 1px solid #1e88e5; border-radius: 3px; color: #1e88e5; font-size: 14px; font-family: inherit; cursor: pointer; white-space: nowrap;" onClick="{{ act.white }}">选中加白</button>
          <button class="cbtn" style="display: flex; align-items: center; height: 30px; padding: 0 14px; background: #ffffff; border: 1px solid #1e88e5; border-radius: 3px; color: #1e88e5; font-size: 14px; font-family: inherit; cursor: pointer; white-space: nowrap;" onClick="{{ act.black }}">选中加黑</button>
          <span style="width: 1px; height: 18px; background: #dde1e7; margin: 0 4px;"></span>
          <!-- 按搜索条件加白：不用勾选，把按当前查询条件查出来的全部进程（所有分页）加入白名单；同样先弹出选择白名单的弹窗 -->
          <button class="cbtn" style="display: flex; align-items: center; height: 30px; padding: 0 14px; background: #ffffff; border: 1px solid #1e88e5; border-radius: 3px; color: #1e88e5; font-size: 14px; font-family: inherit; cursor: pointer; white-space: nowrap;" onClick="{{ act.allWhite }}" title="{{ act.allTitleW }}">按搜索条件加白</button>
        </div>
      </div>


      <!-- ============ 高级搜索 · 查询面板（参考截图 12；按产品给的图精简） ============
           一行四样：文件哈希 / 进程路径 / 终端（左边下拉选按「终端名称」还是「IP地址」查，右边填关键字）/ 查询；
           都是模糊匹配；填好后点「查询」或在任一输入框里按回车才筛选；
           不设「已加状态」「终端多选」「重置」：按图精简掉了（是否加过白 / 黑看列表的白名单、黑名单两列）；
           不设「进程名称」条件：数据库里没有单独的进程名称字段，进程名称就是从进程路径取的，按名称搜等于按路径搜，用「进程路径」即可 -->
      <template data-sc="if" value="{{ advOpen }}" hint-placeholder-val="{{ false }}">
      <div style="flex-shrink: 0; margin: 0 10px 10px; padding: 8px 16px; background: #f5f7fa; display: flex; flex-direction: column; gap: 2px;">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 32px; padding: 6px 0 4px;">
          <label style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
            <span style="flex-shrink: 0; color: #5a6475; font-size: 13px; white-space: nowrap;">文件哈希：</span>
            <input id="q-md5" type="text" aria-label="文件哈希" value="{{ q.d.md5 }}" onChange="{{ q.on.md5 }}" onKeyDown="{{ q.onKey }}" placeholder="请输入" style="width: 300px; height: 30px; padding: 0 10px; border: 1px solid #d5d9e0; border-radius: 2px; background: #ffffff; color: #333333; font-size: 13px; font-family: inherit;">
          </label>
          <label style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
            <span style="flex-shrink: 0; color: #5a6475; font-size: 13px; white-space: nowrap;">进程路径：</span>
            <input id="q-path" type="text" aria-label="进程路径" value="{{ q.d.path }}" onChange="{{ q.on.path }}" onKeyDown="{{ q.onKey }}" placeholder="请输入" style="width: 300px; height: 30px; padding: 0 10px; border: 1px solid #d5d9e0; border-radius: 2px; background: #ffffff; color: #333333; font-size: 13px; font-family: inherit;">
          </label>
          <!-- 终端：先选查哪个字段（默认终端名称），再填关键字；查出来的是「在这些终端上出现过」的进程 -->
          <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
            <select aria-label="终端查询字段" value="{{ q.d.hostField }}" onChange="{{ q.on.hostField }}" style="width: 160px; height: 30px; padding: 0 10px; border: 1px solid #d5d9e0; border-radius: 2px; background: #ffffff; color: #333333; font-size: 13px; font-family: inherit;">
              <template data-sc="for" list="{{ q.hostFields }}" as="o" hint-placeholder-count="2">
                <option value="{{ o.v }}">{{ o.t }}</option>
              </template>
            </select>
            <input id="q-host" type="text" aria-label="终端关键字" value="{{ q.d.hostKw }}" onChange="{{ q.on.hostKw }}" onKeyDown="{{ q.onKey }}" placeholder="请输入" style="width: 300px; height: 30px; padding: 0 10px; border: 1px solid #d5d9e0; border-radius: 2px; background: #ffffff; color: #333333; font-size: 13px; font-family: inherit;">
          </div>
          <!-- 查询：让上面的输入条件生效 -->
          <button class="pbtn" onClick="{{ q.query }}" style="flex-shrink: 0; height: 30px; padding: 0 28px; background: #1e88e5; border: 1px solid #1e88e5; border-radius: 2px; color: #ffffff; font-size: 13px; cursor: pointer; font-family: inherit;">查询</button>
        </div>
        <!-- 已生效的输入条件，提示一下正在按什么查（「按搜索条件加白」加的就是这些条件查出来的进程） -->
        <template data-sc="if" value="{{ q.active }}" hint-placeholder-val="{{ false }}">
          <div style="padding: 0 0 6px 0; color: #5a6475; font-size: 12px;">当前查询：{{ q.activeText }}</div>
        </template>
      </div>
      </template>

      <!-- ============ 进程列表 ============ -->
      <!-- 列表区域占满剩余高度，底部一条边线把列表和下方的已选 / 分页栏分开（参考截图 02） -->
      <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; margin: 0 10px; border-bottom: 1px solid #dde1e7; overflow: hidden;">
        <!-- 列表：按「进程路径 + 文件哈希」聚合，一行一个组合 -->
        <!-- 表头：进程名称 → 文件哈希 → 进程路径 → 系统类型 → 终端数 → 白名单 / 黑名单个数 -->
        <div style="display: flex; align-items: center; height: 36px; flex-shrink: 0; background: #edf0f4; color: #1f2d3d; font-weight: 700; font-size: 14px;">
          <div style="width: 50px; flex-shrink: 0; display: flex; justify-content: center;"><input type="checkbox" aria-label="全选" checked="{{ allChecked }}" onChange="{{ toggleAll }}"></div>
          <div style="width: 220px; flex-shrink: 0; padding: 0 8px; border-left: 1px solid #dde1e7;">进程名称</div>
          <div style="width: 300px; flex-shrink: 0; padding: 0 8px; border-left: 1px solid #dde1e7;">文件哈希</div>
          <div style="width: 650px; flex-shrink: 0; padding: 0 8px; border-left: 1px solid #dde1e7;">进程路径</div>
          <div style="width: 140px; flex-shrink: 0; padding: 0 8px; border-left: 1px solid #dde1e7;">系统类型</div>
          <div style="width: 110px; flex-shrink: 0; padding: 0 8px; border-left: 1px solid #dde1e7;">终端数</div>
          <div style="width: 112px; flex-shrink: 0; padding: 0 8px; border-left: 1px solid #dde1e7;">白名单</div>
          <div style="width: 112px; flex-shrink: 0; padding: 0 8px; border-left: 1px solid #dde1e7;">黑名单</div>
        </div>

        <!-- 数据行：一行一个「进程路径 + 文件哈希」组合，不折叠；数据在下方脚本 procRows 里算好 -->
        <div style="display: flex; flex-direction: column; flex: 1 1 0; min-height: 0; overflow-y: auto;">
          <template data-sc="for" list="{{ procRows }}" as="r" hint-placeholder-count="6">
            <div class="row" style="display: flex; align-items: center; height: 36px; border-bottom: 1px solid #eef0f3; font-size: 13px; color: #333333;">
              <div style="width: 50px; flex-shrink: 0; display: flex; justify-content: center;"><input type="checkbox" aria-label="选择" checked="{{ r.checked }}" onChange="{{ r.onCheck }}"></div>
              <!-- 进程信息：进程名称 / 文件哈希 / 进程路径  -->
              <div class="ell" title="{{ r.proc }}" style="width: 220px; flex-shrink: 0; padding: 0 8px;">{{ r.proc }}</div>
              <div class="ell" title="{{ r.md5 }}" style="width: 300px; flex-shrink: 0; padding: 0 8px; color: #5a6475; font-family: Menlo, Consolas, monospace; font-size: 12px;">{{ r.md5 }}</div>
              <div class="ell" title="{{ r.path }}" style="width: 650px; flex-shrink: 0; padding: 0 8px; color: #5a6475;">{{ r.path }}</div>
              <!-- 系统类型：Windows / Linux/信创 -->
              <div class="ell" style="width: 140px; flex-shrink: 0; padding: 0 8px;">{{ r.os }}</div>
              <!-- 终端数：蓝色链接，点开可看是哪些终端 -->
              <div style="width: 110px; flex-shrink: 0; padding: 0 8px;"><button onClick="{{ r.openHosts }}" title="查看这个进程在哪些终端上" style="border: 0; background: transparent; padding: 0; color: #1e88e5; font-size: 13px; font-family: inherit; cursor: pointer; text-decoration: none;">{{ r.hostCount }}</button></div>
              <!-- 白名单 / 黑名单：这个「路径 + 文件哈希」所在的名单个数；点数字弹出「进程所在白名单 / 黑名单」；0 个显示浅灰、点了没反应 -->
              <div style="width: 112px; flex-shrink: 0; padding: 0 8px;"><button onClick="{{ r.openWl }}" title="{{ r.wlTitle }}" style="border: 0; background: transparent; padding: 0; font-size: 13px; font-family: inherit; text-decoration: none; color: {{ r.wlColor }}; cursor: {{ r.wlCursor }};">{{ r.wlCount }}</button></div>

<script>
// 页面属性的默认值（设计稿右侧属性面板里的那些开关）
const PROP_DEFS = {"$preview":{"width":1920,"height":1080}};

// ======================================================================
// 小渲染器：替代设计工具的运行时，让页面脱离设计工具也能直接打开
// 支持：{{ a.b }} 取值、<template data-sc="for"> 循环、<template data-sc="if"> 条件、
//      onClick / onChange 事件、setState 后整页重新渲染
// ======================================================================

// 页面逻辑类的父类：提供 props（属性默认值）、state（页面状态）、setState（改状态并重绘）
class DCLogic {
  constructor(props) {
    this.props = props || {};
    this.state = {};
  }
  setState(patch) {
    Object.assign(this.state, patch);   // 合并新状态
    render();                           // 重新画整页
  }
}

// 按 "a.b.c" 从作用域里取值；true / false / 数字 这种字面量直接返回
function lookup(scope, path) {
  path = path.trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  let cur = scope;
  for (const key of path.split('.')) {
    if (cur == null) return undefined;
    cur = cur[key];
  }
  return cur;
}

const WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;   // 整个属性值就是一个 {{ }}（要保留原始类型，比如函数、布尔）
const PART = /\{\{([^}]+)\}\}/g;           // 字符串里夹着的 {{ }}

// 把字符串里的 {{ }} 都换成值
function interp(str, scope) {
  return str.replace(PART, (_, p) => {
    const v = lookup(scope, p);
    return v == null ? '' : String(v);
  });
}

// 递归渲染一个模板节点，结果追加到 parent 里
function renderNode(node, scope, parent) {
  // 文字节点：替换 {{ }}
  if (node.nodeType === 3) {
    parent.appendChild(document.createTextNode(interp(node.nodeValue, scope)));
    return;
  }
  if (node.nodeType !== 1) return;   // 注释等其他节点跳过

  // 循环：<template data-sc="for" list="{{ rows }}" as="r">
  if (node.tagName === 'TEMPLATE' && node.dataset.sc === 'for') {
    const list = lookup(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];
    const as = node.getAttribute('as');
    list.forEach((item, i) => {
      // 子作用域：继承外层，再加上当前这一项和序号
      const child = Object.create(scope);
      child[as] = item;
      child.$index = i;
      node.content.childNodes.forEach((n) => renderNode(n, child, parent));
    });
    return;
  }
  // 条件：<template data-sc="if" value="{{ x }}">，值为真才渲染里面的内容
  if (node.tagName === 'TEMPLATE' && node.dataset.sc === 'if') {
    const v = lookup(scope, node.getAttribute('value').replace(/[{}]/g, ''));
    if (v) node.content.childNodes.forEach((n) => renderNode(n, scope, parent));
    return;
  }

  // 普通元素：复制标签，逐个处理属性
  // 必须按原节点的命名空间创建：svg / path 这些图标属于 SVG 命名空间，
  // 用 createElement 建出来是"假的 svg"，浏览器不会画（之前小箭头、图标不显示就是这个原因）
  const el = node.namespaceURI === 'http://www.w3.org/1999/xhtml'
    ? document.createElement(node.localName)
    : document.createElementNS(node.namespaceURI, node.localName);
  const props = {};   // 要在插入后设置的属性（selected / checked / value）
  for (const attr of Array.from(node.attributes)) {
    const name = attr.name;
    const m = attr.value.match(WHOLE);
    if (m) {
      const v = lookup(scope, m[1]);
      if (name.startsWith('on')) {
        // 事件：onClick → click；链接 href="#" 的点击不跳页面
        if (typeof v === 'function') {
          const evt = name.slice(2).toLowerCase();
          // 文本输入框的 onChange：和 React 一样每输入一个字就触发；中文输入法拼字过程中不触发，选完字再触发
          const isText = (el.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/i.test(node.getAttribute('type') || 'text')) || el.tagName === 'TEXTAREA';
          if (evt === 'change' && isText) {
            el.addEventListener('input', (e) => { if (!e.isComposing) v(e); });
            el.addEventListener('compositionend', (e) => v(e));
          } else {
            el.addEventListener(evt, (e) => {
              if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
              v(e);
            });
          }
        }
      } else if (name === 'checked' || name === 'selected' || name === 'value') {
        props[name] = v;                      // 这几个要用属性赋值才生效
      } else if (v === false || v == null) {
        // false / 空值：不写这个属性
      } else {
        el.setAttribute(name, String(v));
      }
    } else if (attr.value.indexOf('{{') >= 0) {
      el.setAttribute(name, interp(attr.value, scope));
    } else if (name === 'checked' || name === 'selected') {
      props[name] = true;                     // 写死的 checked / selected
    } else {
      el.setAttribute(name, attr.value);
    }
  }
  // 子节点（<template> 自己的内容在 .content 里）
  const kids = node.tagName === 'TEMPLATE' ? node.content.childNodes : node.childNodes;
  kids.forEach((n) => renderNode(n, scope, el));
  parent.appendChild(el);
  // 插入后再设置属性（option 的 selected 必须在进了 select 之后设）
  if ('value' in props) el.value = props.value == null ? '' : props.value;
  if ('checked' in props) el.checked = !!props.checked;
  if ('selected' in props) el.selected = !!props.selected;
}

let COMP = null;   // 页面逻辑实例

// 整页渲染：取最新数据 → 按模板生成 DOM → 替换掉旧的
function render() {
  const vals = COMP.renderVals();

  const frag = document.createDocumentFragment();
  TPL.content.childNodes.forEach((n) => renderNode(n, vals, frag));
  // 保留页面滚动位置，避免每次点击后跳回顶部
  const x = window.scrollX, y = window.scrollY;
  // 记下当前有焦点的输入框（按 id）和光标位置
  const ae = document.activeElement;
  const fid = ae && ae.id;
  let s0 = null, s1 = null;
  try { s0 = ae.selectionStart; s1 = ae.selectionEnd; } catch (e) {}
  root.replaceChildren(frag);
  window.scrollTo(x, y);
  // 重绘后把焦点和光标放回去
  if (fid) {
    const n = document.getElementById(fid);
    if (n) { n.focus(); try { if (s0 != null) n.setSelectionRange(s0, s1); } catch (e) {} }
  }
}

// 启动：读模板、按属性默认值创建页面逻辑、第一次渲染

  COMP = new Component(defaults);
  render();
});

      };
    };
    // ---------- 进程所在白名单 / 黑名单弹窗：state.ld = { kind: 'w' / 'b', md5, path }（null = 没打开）；ldKw 正在输入，ldQ 点了搜索后生效的关键字（只按名单名称搜） ----------
    const ldSt = st.ld || null;
    const ldName = ldSt && ldSt.kind === 'b' ? '黑名单' : '白名单';
    const ldQ = String(st.ldQ || '').toLowerCase();
    const ldAll = ldSt ? (ldSt.kind === 'b' ? blOf(ldSt) : wlOf(ldSt)).map((n) => ({ name: n, os: (LIST_META[n] || [])[0] || '---', created: (LIST_META[n] || [])[1] || '---' })) : [];
    const ldRows = ldAll.filter((x) => !ldQ || x.name.toLowerCase().indexOf(ldQ) >= 0);   // 名称模糊匹配
    const ldSearch = () => this.setState({ ldQ: String(st.ldKw || '').trim() });
    const ld = {
      open: !!ldSt,
      title: '进程所在' + ldName,
      kindName: ldName,
      path: ldSt ? ldSt.path : '',
      md5: ldSt ? ldSt.md5 : '',
      col0: ldName + '名称', col1: '系统类型', col2: '创建时间',
      kw: st.ldKw || '',
      ph: '请输入' + ldName + '名称',
      onKw: (e) => this.setState({ ldKw: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') ldSearch(); },   // 回车 = 搜索
      search: ldSearch,
      rows: ldRows,
      count: ldRows.length,
      empty: ldRows.length === 0,
      emptyText: '没有符合条件的' + ldName,
      close: () => this.setState({ ld: null }),
    };
    // 打开名单弹窗（0 个时不打开）
    const openLd = (kind, r) => {
      const n = (kind === 'b' ? blOf(r) : wlOf(r)).length;
      if (!n) return;
      this.setState({ ld: { kind, md5: r.md5, path: r.path }, ldKw: '', ldQ: '' });
    };
    // ---------- 进程所属终端弹窗：state.hd = { md5, path }（按路径 + 文件哈希找终端；null = 没打开）；hdField / hdKw 是正在输入的，hdQ 是点了搜索后生效的 ----------
    // 终端 MAC 地址（示例数据）
    const MAC = {
      '193.168.15.83': '00-0C-29-55-06-52', '193.168.55.0': '00-0C-29-3A-1B-77', 'srv-db-01': '00-50-56-A1-0B-21',
      '193.168.15.85': '00-0C-29-F9-7F-0C', 'srv-web-02': '00-50-56-A1-0B-35', 'kylin-01': '00-1C-42-6E-2D-90',
      'ak360-PC': '00-0C-29-8D-44-1A', 'qihuan-test': '00-0C-29-C2-93-5E', 'wmx': '00-0C-29-07-B8-E4',
    };
    // 搜索字段：IP地址 / 终端名称 / MAC（不按所在组搜）
    const HD_FIELDS = [['ip', 'IP地址'], ['host', '终端名称'], ['mac', 'MAC']];
    const hdSt = st.hd || null;
    const hdField = st.hdField || 'ip';                 // 默认按 IP 地址搜（和截图 17 一致）
    const hdQ = st.hdQ || null;                        // 生效的搜索：{ field, text }
    const hdAll = hdSt ? allRows.filter((x) => x.path === hdSt.path && x.md5 === hdSt.md5)   // 路径和文件哈希都相同的终端
      .filter((x, i, a) => a.findIndex((y) => y.host === x.host) === i)   // 一台终端只列一次
      .map((x) => ({ ...x, mac: MAC[x.host] || '---' })) : [];   // 不再单列「状态」，在线 / 离线只看终端名称前的图标颜色
    const hdRows = hdAll.filter((x) => !hdQ || !hdQ.text || String(x[hdQ.field] || '').toLowerCase().indexOf(hdQ.text.toLowerCase()) >= 0);
    const hdSearch = () => this.setState({ hdQ: { field: hdField, text: String(st.hdKw || '').trim() } });
    const hd = {
      open: !!hdSt,
      title: '进程所属终端',
      // 上方信息：进程路径 / 文件哈希
      md5: hdSt ? hdSt.md5 : '',
      path: hdSt ? hdSt.path : '',
      fields: HD_FIELDS.map(([v, t]) => ({ v, t })),
      field: hdField,
      kw: st.hdKw || '',
      ph: '请输入' + (HD_FIELDS.find((x) => x[0] === hdField) || HD_FIELDS[0])[1],
      onField: (e) => this.setState({ hdField: e.target.value }),
      onKw: (e) => this.setState({ hdKw: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') hdSearch(); },   // 回车 = 搜索
      search: hdSearch,
      rows: hdRows,
      count: hdRows.length,
      empty: hdRows.length === 0,
      close: () => this.setState({ hd: null }),
    };
    // 每行：勾选框、终端数 / 名单个数的点击
    const withOps = (list) => list.map((r) => ({
      ...r,
      // 点终端数：打开进程所属终端弹窗，搜索条件清空
      openHosts: () => this.setState({ hd: { md5: r.md5, path: r.path }, hdField: 'ip', hdKw: '', hdQ: null }),
      checked: !!sel[pmKey(r)],
      onCheck: () => setSel({ [pmKey(r)]: !sel[pmKey(r)] }),
      ...listCells(r),
      openWl: () => openLd('w', r),
      openBl: () => openLd('b', r),
    }));

    return {
      osTypes: OS_TYPES,
      menus, procRows: withOps(pageRows),
      // 高级搜索
      advOpen, toggleAdv, advCaret: advOpen ? '180deg' : '0deg', advColor: advOpen ? '#1e88e5' : '#4a5568',
      q, fOs, onOs, noData, resultCount,
      toast, toastOn, toastOk, toastWarn,
      act, pk, nf, hd, ld, pg, selCount, allChecked, toggleAll,
    };
  }
}
</script>
