<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>进程管控 - 概览</title>
<style>

/* 页面基础：系统中文字体，灰底 */
body{margin:0;font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#f0f2f5}
/* 链接颜色和学习任务列表页一致 */
a{color:#1e88e5;text-decoration:none}a:hover{color:#1565c0}
/* 左侧导航：悬停效果（截图 14）—— 底色变亮一点的深蓝、左侧出现亮蓝竖条、文字变白；一级菜单的图标变亮蓝 */
.nav1:hover,.nav2:hover{background:#0d3479 !important;border-left-color:#08a7ff !important;color:#ffffff !important}
.nav1:hover .nav-ico{color:#33b8ff !important}

/* ===== 概览页（终端视角）===== */
.tcell{box-sizing:border-box;padding:0 8px;flex-shrink:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row:hover{background:#f4f8fd}
input[type=checkbox]{width:14px;height:14px;margin:0;accent-color:#1e88e5}
/* 分组树：悬停浅灰底；选中浅蓝底蓝字 */
.gnode:hover{background:#f2f5f9}
/* 高级搜索：按钮悬停变蓝；点选项选中 = 蓝框蓝字；输入框 / 下拉框统一外观；筛选 / 重置按钮悬停 */
.advbtn:hover{color:#1e88e5}
.chip:hover{color:#1e88e5}
.qi{box-sizing:border-box;height:30px;padding:0 10px;font-family:inherit;font-size:13px;color:#333333;background:#ffffff;border:1px solid #d5d9e0;border-radius:2px}
.qi:focus{outline:none;border-color:#1e88e5}
.qi::placeholder{color:#b0b8c4}
select{font-family:inherit;font-size:13px;color:#333333;background:#ffffff;border:1px solid #d5d9e0;border-radius:3px;height:30px;padding:0 8px}
.pbtn:hover{background:#1565c0 !important}
.cbtn:hover{border-color:#1e88e5;color:#1e88e5}
/* 分页按钮：当前页蓝底白字，不可点的变灰（上面 .pg 几行） */
/* 表头说明气泡（「策略模式」）：平时隐藏，鼠标移到这一列表头上才显示 */
.pg{min-width:30px;height:28px;padding:0 6px;border:1px solid #d5d9e0;border-radius:2px;background:#ffffff;color:#333333;font-family:inherit;font-size:13px;cursor:pointer}
.pg:hover:not([disabled]){border-color:#1e88e5;color:#1e88e5}
.pg[disabled]{color:#c0c6cf;background:#f5f7fa;cursor:not-allowed}
.pg.on{background:#1e88e5;border-color:#1e88e5;color:#ffffff}
.notecol .note-pop{display:none}
.notecol:hover .note-pop{display:block}
.notecol:hover .note-ico{color:#1e88e5}

/* 独立页面：页面固定 1920×1080，窗口小时可以滚动 */
html,body{margin:0}
</style>
</head>
<body>
<!-- 渲染结果放这里 -->
<div id="app"></div>

<!-- 页面模板（和设计稿一致） -->
<template id="page-tpl">


<!-- ============ 整个页面：固定 1920 x 1080（外壳与「学习任务列表」页一致） ============ -->
<div style="position: relative; width: 1920px; height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; background: #f0f2f5; color: #333333; font-size: 14px; overflow: hidden;">

  <!-- ============ 顶栏（50px 高） ============ -->
  <div style="height: 50px; flex-shrink: 0; display: flex; align-items: stretch; background: #ffffff; border-bottom: 1px solid #e3e6eb;">
    <!-- 左上角 LOGO 区：深蓝底 -->
    <div style="width: 180px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #0f2a5c; color: #ffffff; font-size: 22px; font-weight: 800; letter-spacing: 2px;">SOC</div>
    <!-- 系统标题 -->
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 20px; flex-grow: 1;">
      <span style="font-size: 18px; font-weight: 700; color: #1f2d3d;">终端威胁检测与响应系统</span>
      <span style="font-size: 14px; color: #1f2d3d;">· 专用</span>
      <span style="font-size: 13px; color: #8a94a6; font-style: italic; margin-left: 12px;">一切尽在掌握！</span>
    </div>
    <!-- 右侧：消息数 / 用户 / 下载 -->
    <div style="display: flex; align-items: center; gap: 16px; padding: 0 20px;">
      <div style="display: flex; align-items: center; gap: 6px; background: #f2f4f7; border-radius: 4px; padding: 4px 10px; color: #4a5568;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
        <span>101</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: #f2f4f7; border-radius: 16px; padding: 4px 12px 4px 6px; color: #4a5568;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e88e5" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
        <span>optAdmin</span>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #1e88e5; display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6"></path></svg>
      </div>
    </div>
  </div>

  <!-- ============ 顶栏以下：左导航 + 右侧内容 ============ -->
  <div style="flex-grow: 1; display: flex; min-height: 0;">

    <!-- ============ 左侧主导航（180px，深蓝；当前高亮：进程管控） ============ -->
    <nav style="width: 180px; flex-shrink: 0; background: #0f2a5c; color: #ffffff; display: flex; flex-direction: column; padding-top: 6px;">
      <div style="display: flex; flex-direction: column;">
        <template data-sc="for" list="{{ menus }}" as="m" hint-placeholder-count="19">
          <!-- 一级菜单：普通状态浅色文字；选中 / 悬停时底色变亮、左侧亮蓝竖条、文字变白、图标变亮蓝（截图 13 / 14）
               有二级菜单的在右边显示箭头（展开朝上、收起朝下），点击展开 / 收起 -->
          <a href="#" class="nav1" onClick="{{ m.toggle }}" aria-expanded="{{ m.expanded }}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 0 0 34px; box-sizing: border-box; color: {{ m.fg }}; font-size: 14px; background: {{ m.bg }}; border-left: 3px solid {{ m.bar }};">
            <span class="nav-ico" style="display: flex; color: {{ m.icoColor }};"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ m.icon }}"></path></svg></span>
            <span style="flex-grow: 1;">{{ m.label }}</span>
            <template data-sc="if" value="{{ m.hasSub }}" hint-placeholder-val="{{ false }}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 16px; transform: rotate({{ m.caret }});"><path d="M6 9l6 6 6-6"></path></svg>
            </template>
          </a>
          <!-- 二级菜单：缩进，前面一个小圆点（截图 13）；当前页面：底色变亮 + 左侧亮蓝竖条 + 白字 + 亮蓝圆点；悬停同样效果（截图 14） -->
          <template data-sc="if" value="{{ m.expanded }}" hint-placeholder-val="{{ false }}">
            <template data-sc="for" list="{{ m.children }}" as="c" hint-placeholder-count="5">
              <a href="{{ c.href }}" class="nav2" aria-current="{{ c.current }}" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 0 0 65px; box-sizing: border-box; color: {{ c.fg }}; font-size: 14px; background: {{ c.bg }}; border-left: 3px solid {{ c.bar }};">
                <span style="width: 5px; height: 5px; border-radius: 50%; background: {{ c.dot }}; flex-shrink: 0;"></span>
                <span>{{ c.label }}</span>
              </a>
            </template>
          </template>
        </template>
      </div>
      <!-- 底部版权信息 -->
      <div style="margin-top: auto; padding: 14px 10px 12px; border-top: 1px solid #1d3f7d; text-align: center; font-size: 12px; line-height: 18px; color: #c5d0e3;">
        <div>[公司名称]</div>
        <div>版权所有</div>
        <div>版本：3.0 build：305034</div>
      </div>
    </nav>

    <!-- ============ 左侧：终端分组面板（截图 15 左侧）============ -->
    <aside style="width: 250px; flex-shrink: 0; display: flex; flex-direction: column; margin: 12px 0 12px 12px; background: #ffffff; border: 1px solid #e3e6eb;">
      <!-- 标题：终端分组 [在线 / 总数]（选中分组的） -->
      <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; flex-shrink: 0; padding: 0 12px; border-bottom: 1px solid #eef0f3;">
        <span style="font-size: 15px; font-weight: 700; color: #1f2d3d;">终端分组 <span style="font-weight: 400; font-size: 13px; color: #1e88e5;">[{{ groupOnline }}/{{ groupTotal }}]</span></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a94a6" stroke-width="2" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v8"></path></svg>
      </div>
      <!-- 分组树：根管理组可以展开 / 收起；点分组 → 右侧只显示这个分组的终端（根管理组 = 全部） -->
      <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 6px 0;">
        <template data-sc="for" list="{{ groups }}" as="g" hint-placeholder-count="8">
          <div class="gnode" onClick="{{ g.pick }}" aria-selected="{{ g.on }}" style="display: flex; align-items: center; gap: 6px; height: 32px; padding-left: {{ g.indent }}px; padding-right: 10px; cursor: pointer; background: {{ g.bg }}; color: {{ g.fg }}; font-size: 13px;">
            <!-- 展开 / 收起按钮（只有根管理组有）：方框里 - 或 + -->
            <template data-sc="if" value="{{ g.isRoot }}" hint-placeholder-val="{{ false }}">
              <span onClick="{{ g.toggle }}" style="width: 12px; height: 12px; border: 1px solid #8a94a6; border-radius: 1px; display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; color: #5a6475; flex-shrink: 0; background: #ffffff;">{{ g.sign }}</span>
            </template>
            <!-- 分组图标 -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0; color: {{ g.icoColor }};"><path d="M9 3h6v5H9zM4 16h6v5H4zM14 16h6v5h-6zM12 8v4M7 16v-4h10v4"></path></svg>
            <span style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ g.name }}</span>
            <span style="font-size: 12px; color: #8a94a6;">{{ g.online }}/{{ g.total }}</span>
          </div>
        </template>
      </div>
    </aside>

    <!-- ============ 右侧主内容区 ============ -->
    <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; margin: 12px; background: #ffffff; border: 1px solid #e3e6eb;">

      <!-- 页签：进程管控概览下 3 个页签 概览 / 日志 / 策略（当前选中：概览）；统计分析页已不在页签里（页面保留）；其他页面都在左侧二级菜单里
           选中的页签：白底 + 顶部蓝线 + 蓝字 -->
      <div style="display: flex; align-items: stretch; height: 44px; flex-shrink: 0; background: #f5f7fa; border-bottom: 1px solid #e3e6eb;">
        <a href="概览.html" style="position: relative; z-index: 1; margin-bottom: -1px; width: 116px; display: flex; align-items: center; justify-content: center; background: #ffffff; border-top: 2px solid #1e88e5; border-right: 1px solid #e3e6eb; border-bottom: 1px solid #ffffff; color: #1e88e5; font-weight: 700; font-size: 15px;">概览</a>
        <a href="审计日志列表.html" style="width: 116px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #e3e6eb; color: #333333; font-size: 15px;">日志</a>
        <a href="策略详情.html" style="width: 116px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #e3e6eb; color: #333333; font-size: 15px;">策略</a>
      </div>

      <!-- 工具栏：右侧 高级搜索 / 刷新 / 列设置；点"高级搜索"展开下方查询面板 -->
      <div style="display: flex; align-items: center; justify-content: flex-end; height: 50px; flex-shrink: 0; padding: 0 10px;">
        <div style="display: flex; align-items: center; gap: 18px; color: #4a5568;">
          <!-- 高级搜索：点击展开 / 折叠下方的查询面板；展开时蓝字、箭头朝上；页面加载时默认折叠 -->
          <button class="advbtn" onClick="{{ toggleAdv }}" aria-expanded="{{ advExpanded }}" style="display: flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; cursor: pointer; font-family: inherit; font-size: 14px; color: {{ advColor }};">高级搜索
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform: rotate({{ advDeg }}deg);"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="刷新"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="列设置"><path d="M7 4v16M12 4v16M17 4v16"></path></svg>
        </div>
      </div>

      <!-- ============ 高级查询面板：默认折叠，点"高级搜索"展开（样式和审计日志的一致） ============
           两类条件：① 点选项 / 下拉框，选了立刻筛选；② 关键字，填好后点"筛选"才生效；"重置"全部恢复默认
           所有条件之间是"并且"关系，再叠加左侧选中的分组 -->
      <template data-sc="if" value="{{ advOpen }}" hint-placeholder-val="{{ false }}">
        <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; margin: 0 10px 10px; padding: 12px 16px; background: #eef1f6; font-size: 13px;">
          <!-- 子组终端：左侧选中分组时，是否把它下面子分组的终端一起列出来（不包含 = 只看这个分组自己的终端） -->
          <div style="display: flex; align-items: center; gap: 8px; height: 30px;">
            <span style="width: 84px; flex-shrink: 0; text-align: right; color: #5a6475;">子组终端：</span>
            <template data-sc="for" list="{{ subChips }}" as="c" hint-placeholder-count="2">
              <button class="chip" onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="min-width: 76px; height: 28px; padding: 0 14px; border: 1px solid {{ c.border }}; border-radius: 2px; background: {{ c.bg }}; color: {{ c.color }}; font-family: inherit; font-size: 13px; cursor: pointer;">{{ c.label }}</button>
            </template>
            <span style="margin-left: 12px; color: #8a94a6;">当前分组：{{ groupName }}</span>
          </div>
          <!-- 在线状态 -->
          <div style="display: flex; align-items: center; gap: 8px; height: 30px;">
            <span style="width: 84px; flex-shrink: 0; text-align: right; color: #5a6475;">在线状态：</span>
            <template data-sc="for" list="{{ onChips }}" as="c" hint-placeholder-count="3">
              <button class="chip" onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="min-width: 76px; height: 28px; padding: 0 14px; border: 1px solid {{ c.border }}; border-radius: 2px; background: {{ c.bg }}; color: {{ c.color }}; font-family: inherit; font-size: 13px; cursor: pointer;">{{ c.label }}</button>
            </template>
          </div>
          <!-- 策略模式（终端通过 epstate 表上报） -->
          <div style="display: flex; align-items: center; gap: 8px; height: 30px;">
            <span style="width: 84px; flex-shrink: 0; text-align: right; color: #5a6475;">策略模式：</span>
            <template data-sc="for" list="{{ modeChips }}" as="c" hint-placeholder-count="5">
              <button class="chip" onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="min-width: 76px; height: 28px; padding: 0 14px; border: 1px solid {{ c.border }}; border-radius: 2px; background: {{ c.bg }}; color: {{ c.color }}; font-family: inherit; font-size: 13px; cursor: pointer;">{{ c.label }}</button>
            </template>
          </div>
          <!-- 筛选条件（输入）：先选按哪一列搜，再输入关键字（模糊匹配），点"筛选"生效 -->
          <div style="display: flex; align-items: center; gap: 8px; height: 32px;">
            <span style="width: 84px; flex-shrink: 0; text-align: right; color: #5a6475;">筛选条件：</span>
            <select aria-label="筛选字段" onChange="{{ inField }}" style="width: 130px; border-radius: 2px;">
              <template data-sc="for" list="{{ fieldOpts }}" as="o" hint-placeholder-count="2">
                <option value="{{ o.value }}" selected="{{ o.sel }}">{{ o.label }}</option>
              </template>
            </select>
            <input class="qi" type="text" placeholder="请输入关键字" aria-label="关键字" value="{{ draft.kw }}" onInput="{{ inKw }}" style="width: 280px;">
            <button class="pbtn" onClick="{{ doQuery }}" style="height: 30px; padding: 0 22px; background: #1e88e5; border: 1px solid #1e88e5; border-radius: 2px; color: #ffffff; font-family: inherit; font-size: 14px; cursor: pointer;">筛选</button>
            <button class="cbtn" onClick="{{ doReset }}" style="height: 30px; padding: 0 16px; background: #ffffff; border: 1px solid #d5d9e0; border-radius: 2px; color: #333333; font-family: inherit; font-size: 14px; cursor: pointer;">重置</button>
            <!-- 有条件生效时显示：筛出几台 / 当前分组共几台 -->
            <template data-sc="if" value="{{ filtering }}" hint-placeholder-val="{{ false }}">
              <span style="margin-left: 8px; color: #5a6475;">已筛选出 <span style="color: #1e88e5;">{{ total }}</span> 台，共 {{ scopeTotal }} 台</span>
            </template>
          </div>
        </div>
      </template>

      <!-- ============ 终端列表 ============ -->
      <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; margin: 0 10px; border-bottom: 1px solid #dde1e7;">
        <!-- 各列按比例分配宽度（flex: 原宽度），不会出现某一列特别宽
             列表不带勾选框
             表头：终端名称 / IP地址 / 所在组 / 操作系统 / 策略模式 / 策略来源 / 白名单 / 黑名单 -->
        <div style="display: flex; align-items: center; height: 36px; flex-shrink: 0; background: #edf0f4; color: #1f2d3d; font-weight: 700; font-size: 14px;">
          <template data-sc="for" list="{{ cols }}" as="c" hint-placeholder-count="14">
            <div class="tcell {{ c.cls }}" title="{{ c.tip }}" style="position: relative; flex: {{ c.w }} 1 0px; min-width: 0; text-align: {{ c.align }}; border-left: 1px solid #dde1e7;">{{ c.label }}
              <!-- 说明气泡：鼠标移到这一列表头上才显示（.notecol:hover），出现在表头正上方，小三角指向这一列（目前只有「策略模式」有）
                   表头文字后面的小 ⓘ 图标提示"这里有说明" -->
              <template data-sc="if" value="{{ c.hasNote }}" hint-placeholder-val="{{ false }}">
                <svg class="note-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px; margin-left: 3px; color: #8a94a6; cursor: help;" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>
                <div class="note-pop" style="position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); z-index: 5; padding: 5px 10px; background: #fff8e1; border: 1px solid #ffcc80; border-radius: 3px; color: #8d6e00; font-size: 12px; font-weight: 400; line-height: 16px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,0.08);">
                  {{ c.note }}
                  <span style="position: absolute; left: 50%; top: 100%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid #ffcc80;"></span>
                </div>
              </template>
            </div>
          </template>
        </div>
        <!-- 数据行：一行 = 一台终端；分页显示，只列出当前页 -->
        <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto;">
          <template data-sc="for" list="{{ pageRows }}" as="r" hint-placeholder-count="10">
            <div class="row" style="display: flex; align-items: center; height: 44px; flex-shrink: 0; border-bottom: 1px solid #eef0f3; font-size: 13px; color: #333333;">
              <!-- 终端名称：系统图标（蓝 = 在线，灰 = 离线）+ 蓝色链接
                   点击本应跳到「终端视角」页（显示这台终端的进程管控信息）；该页还没做，目前点了只弹提示、不跳转 -->
              <div class="tcell" style="flex: 150 1 0px; min-width: 0; display: flex; align-items: center; gap: 6px; min-width: 0;">

<script>
// 页面属性的默认值（设计稿右侧属性面板里的那些开关）
const PROP_DEFS = {"$preview": {"width": 1920, "height": 1080}};

// ======================================================================
// 小渲染器：替代设计工具的运行时，让页面脱离设计工具也能直接打开
// 支持：{{ a.b }} 取值、<template data-sc="for"> 循环、<template data-sc="if"> 条件、
//      onClick / onChange 事件、setState 后整页重新渲染
// ======================================================================

// 页面逻辑类的父类：提供 props（属性默认值）、state（页面状态）、setState（改状态并重绘）
class DCLogic {
  constructor(props) {
    this.props = props || {};
    this.state = {};
  }
  setState(patch) {
    Object.assign(this.state, patch);   // 合并新状态
    render();                           // 重新画整页
  }
}

// 按 "a.b.c" 从作用域里取值；true / false / 数字 这种字面量直接返回
function lookup(scope, path) {
  path = path.trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  let cur = scope;
  for (const key of path.split('.')) {
    if (cur == null) return undefined;
    cur = cur[key];
  }
  return cur;
}

const WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;   // 整个属性值就是一个 {{ }}（要保留原始类型，比如函数、布尔）
const PART = /\{\{([^}]+)\}\}/g;           // 字符串里夹着的 {{ }}

// 把字符串里的 {{ }} 都换成值
function interp(str, scope) {
  return str.replace(PART, (_, p) => {
    const v = lookup(scope, p);
    return v == null ? '' : String(v);
  });
}

// 递归渲染一个模板节点，结果追加到 parent 里
function renderNode(node, scope, parent) {
  // 文字节点：替换 {{ }}
  if (node.nodeType === 3) {
    parent.appendChild(document.createTextNode(interp(node.nodeValue, scope)));
    return;
  }
  if (node.nodeType !== 1) return;   // 注释等其他节点跳过

  // 循环：<template data-sc="for" list="{{ rows }}" as="r">
  if (node.tagName === 'TEMPLATE' && node.dataset.sc === 'for') {
    const list = lookup(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];
    const as = node.getAttribute('as');
    list.forEach((item, i) => {
      // 子作用域：继承外层，再加上当前这一项和序号
      const child = Object.create(scope);
      child[as] = item;
      child.$index = i;
      node.content.childNodes.forEach((n) => renderNode(n, child, parent));
    });
    return;
  }
  // 条件：<template data-sc="if" value="{{ x }}">，值为真才渲染里面的内容
  if (node.tagName === 'TEMPLATE' && node.dataset.sc === 'if') {
    const v = lookup(scope, node.getAttribute('value').replace(/[{}]/g, ''));
    if (v) node.content.childNodes.forEach((n) => renderNode(n, scope, parent));
    return;
  }

  // 普通元素：复制标签，逐个处理属性
  // 必须按原节点的命名空间创建：svg / path 这些图标属于 SVG 命名空间，
  // 用 createElement 建出来是"假的 svg"，浏览器不会画（之前小箭头、图标不显示就是这个原因）
  const el = node.namespaceURI === 'http://www.w3.org/1999/xhtml'
    ? document.createElement(node.localName)
    : document.createElementNS(node.namespaceURI, node.localName);
  const props = {};   // 要在插入后设置的属性（selected / checked / value）
  for (const attr of Array.from(node.attributes)) {
    const name = attr.name;
    const m = attr.value.match(WHOLE);
    if (m) {
      const v = lookup(scope, m[1]);
      if (name.startsWith('on')) {
        // 事件：onClick → click；链接 href="#" 的点击不跳页面
        if (typeof v === 'function') {
          el.addEventListener(name.slice(2).toLowerCase(), (e) => {
            if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
            v(e);
          });
        }
      } else if (name === 'checked' || name === 'selected' || name === 'value') {
        props[name] = v;                      // 这几个要用属性赋值才生效
      } else if (v === false || v == null) {
        // false / 空值：不写这个属性
      } else {
        el.setAttribute(name, String(v));
      }
    } else if (attr.value.indexOf('{{') >= 0) {
      el.setAttribute(name, interp(attr.value, scope));
    } else if (name === 'checked' || name === 'selected') {
      props[name] = true;                     // 写死的 checked / selected
    } else {
      el.setAttribute(name, attr.value);
    }
  }
  // 子节点（<template> 自己的内容在 .content 里）
  const kids = node.tagName === 'TEMPLATE' ? node.content.childNodes : node.childNodes;
  kids.forEach((n) => renderNode(n, scope, el));
  parent.appendChild(el);
  // 插入后再设置属性（option 的 selected 必须在进了 select 之后设）
  if ('value' in props) el.value = props.value == null ? '' : props.value;
  if ('checked' in props) el.checked = !!props.checked;
  if ('selected' in props) el.selected = !!props.selected;
}

let TPL = null;    // 页面模板（只解析一次）
let COMP = null;   // 页面逻辑实例

// 整页渲染：取最新数据 → 按模板生成 DOM → 替换掉旧的
function render() {
  const vals = COMP.renderVals();
  const root = document.getElementById('app');
  const frag = document.createDocumentFragment();
  TPL.content.childNodes.forEach((n) => renderNode(n, vals, frag));
  // 保留页面滚动位置，避免每次点击后跳回顶部
  const x = window.scrollX, y = window.scrollY;
  root.replaceChildren(frag);
  window.scrollTo(x, y);
}

// 启动：读模板、按属性默认值创建页面逻辑、第一次渲染
window.addEventListener('DOMContentLoaded', () => {
  TPL = document.getElementById('page-tpl');
  const defaults = {};
  for (const [k, cfg] of Object.entries(PROP_DEFS)) {
    if (cfg && typeof cfg === 'object' && 'default' in cfg) defaults[k] = cfg.default;
  }
  COMP = new Component(defaults);
  render();
});

      { host: 'DEV-LIN-07',   ip: '192.168.3.70',  group: 'verify-dept', os: 'Ubuntu', on: true,  mode: '审计', source: '所在组', wl: '所在组', bl: '', lists: '运维工具白名单' },
      { host: 'DEV-PC-117',   ip: '192.168.6.117', group: '研发部',      os: 'Ubuntu', on: true,  mode: '审计', source: '所在组', wl: '所在组', bl: '', lists: '运维工具白名单' },
      { host: 'OA-PC-088',    ip: '192.168.2.88',  group: '办公区',      os: 'Windows',   on: true,  mode: '学习', source: '所在组', wl: '', bl: '', lists: '' },
      { host: 'OA-PC-131',    ip: '192.168.2.131', group: '办公区',      os: 'Windows',   on: false, mode: '学习', source: '所在组', wl: '', bl: '', lists: '' },
      { host: 'WIN11-PILOT-05', ip: '192.168.8.5', group: '试点组',      os: 'Windows',   on: true,  mode: '学习', source: '所在组', wl: '', bl: '', lists: '' },
      { host: 'NEW-PC-301',   ip: '192.168.9.31',  group: '根管理组',    os: 'Windows',   on: true,  mode: '未开启', source: '所在组', wl: '', bl: '', lists: '' },
      { host: 'NEW-LIN-302',  ip: '10.20.9.32',    group: '根管理组',    os: 'CentOS',    on: false, mode: '未开启', source: '所在组', wl: '', bl: '', lists: '' },
      { host: 'WIN11-NEW-02', ip: '192.168.8.22',  group: '试点组',      os: 'Windows',   on: true,  mode: '学习', source: '所在组', wl: '', bl: '', lists: '' },
    ];
    // 操作系统完整名称（带版本号），按终端名称查；列表「操作系统」列显示这个
    // 高级搜索「系统类型」、终端图标仍按 os（只有系统名）判断
    const OS_FULL = {
      'OA-PC-017': 'Windows 10', 'OA-PC-042': 'Windows 10', 'OA-PC-203': 'Windows 10', 'FIN-PC-003': 'Windows 10',
      'HR-LAPTOP-07': 'Windows 10', 'HR-PC-011': 'Windows 10', 'OA-PC-088': 'Windows 10', 'OA-PC-131': 'Windows 10',
      'WIN11-PILOT-05': 'Windows 11', 'WIN11-NEW-02': 'Windows 11', 'NEW-PC-301': 'Windows 11',
      'srv-web-02': 'Ubuntu 22.04', 'DEV-LIN-07': 'Ubuntu 22.04', 'DEV-PC-117': 'Ubuntu 22.04',
      'srv-db-01': 'CentOS 7.9', 'srv-db-02': 'CentOS 7.9', 'srv-app-05': 'CentOS 7.9', 'NEW-LIN-302': 'CentOS 7.9',
    };
    const MODE = {
      '拦截':   { bg: '#fdecea', fg: '#c62828' },
      '审计':   { bg: '#fff3e0', fg: '#e65100' },
      '学习':   { bg: '#e3f0fc', fg: '#1e88e5' },
      '未开启': { bg: '#eceff3', fg: '#5a6475' },
    };
    const WIN = 'M3 5l8-1v8H3zM13 4l8-1v9h-8zM3 13h8v8l-8-1zM13 13h8v9l-8-1z';
    const LNX = 'M12 3a5 5 0 0 0-5 5v3l-3 5h4l1 4h6l1-4h4l-3-5V8a5 5 0 0 0-5-5M10 9h.5M13.5 9h.5';

    // ======== 分组树：根管理组 → 一级分组 → 子分组 ========
    // PARENT：每个分组的上级；根管理组自己也能直接挂终端（新入网、还没分组的终端）
    const PARENT = {
      '默认分组': '根管理组', '服务器': '根管理组', 'wrh': '根管理组',
      '办公区': '根管理组', '试点组': '办公区',          // 试点组 是 办公区 的子分组
      '研发部': '根管理组', 'verify-dept': '研发部',     // verify-dept 是 研发部 的子分组
    };
    const ORDER = ['默认分组', '服务器', 'wrh', '办公区', '试点组', '研发部', 'verify-dept'];   // 树里的显示顺序
    const depth = (g) => g === '根管理组' ? 0 : depth(PARENT[g]) + 1;                           // 第几层
    const isUnder = (g, top) => g === top || (g !== '根管理组' && isUnder(PARENT[g], top));      // g 是不是 top 自己或它的子孙
    const curGroup = st.group || '根管理组';
    const rootOpen = st.rootOpen !== false;   // 根管理组默认展开
    // 分组右边的 在线 / 总数：按"包含子组"统计
    const count = (g) => {
      const list = TERMS.filter((t) => isUnder(t.group, g));
      return { total: list.length, online: list.filter((t) => t.on).length };
    };
    const node = (name) => {
      const on = name === curGroup, c = count(name), isRoot = name === '根管理组';
      return {
        name, isRoot, on, ...c,
        indent: isRoot ? 12 : 24 + depth(name) * 20,   // 一级分组 44px，子分组 64px
        sign: rootOpen ? '−' : '+',
        bg: on ? '#e8f1fb' : 'transparent', fg: on ? '#1e88e5' : '#333333', icoColor: on ? '#1e88e5' : '#5a6475',
        pick: () => this.setState({ group: name }),
        toggle: (e) => { e.stopPropagation(); this.setState({ rootOpen: !rootOpen }); },
      };
    };
    const groups = [node('根管理组')].concat(rootOpen ? ORDER.map((g) => node(g)) : []);
    const cg = count(curGroup);
    const groupOnline = cg.online, groupTotal = cg.total, groupName = curGroup;

    // ======== 表头 ========
    const cols = [
      { label: '终端名称', w: 150, align: 'left' }, { label: 'IP地址', w: 110, align: 'left' },
      { label: '所在组', w: 90, align: 'left' }, { label: '操作系统', w: 105, align: 'left' },
      { label: '策略模式', w: 80, align: 'center', tip: '终端通过 epstate 表上报：拦截 / 审计 / 学习 / 未开启', note: '终端通过 epstate 表上报' },
      { label: '策略来源', w: 80, align: 'center', tip: '所在组 = 从分组策略继承；分配 = 单独分配给这台终端' },
      { label: '白名单', w: 90, align: 'center', tip: '所在组 = 从分组名单继承；分配 = 单独分配给这台终端；和黑名单互斥' },
      { label: '黑名单', w: 90, align: 'center', tip: '所在组 = 从分组名单继承；分配 = 单独分配给这台终端；和白名单互斥' },
    ].map((c) => ({ ...c, tip: c.note ? '' : (c.tip || c.label), hasNote: !!c.note, cls: c.note ? 'notecol' : 'ell' }));   // 有说明的列：不截断（气泡才能露出来），悬停才显示气泡，不用 title

    // ======== 高级搜索 ========
    // 状态：state.advOpen 面板是否展开（默认折叠）
    //      state.sub 子组终端（in 包含 / ex 不包含）；state.onq 在线状态；state.modeq 策略模式
    //      this._draft 关键字输入框里正在填的内容（打字时不刷新整页）；state.applied 点"筛选"后真正生效的关键字
    const advOpen = !!st.advOpen;
    const toggleAdv = () => this.setState({ advOpen: !advOpen });
    const advExpanded = advOpen ? 'true' : 'false';
    const advColor = advOpen ? '#1e88e5' : '#4a5568';
    const advDeg = advOpen ? 180 : 0;
    const Q_EMPTY = { field: 'host', kw: '' };
    if (!this._draft) this._draft = { ...Q_EMPTY };
    const draft = this._draft;
    const applied = st.applied || Q_EMPTY;
    const typing = (key) => (e) => { draft[key] = e.target.value; if (typeof this.forceUpdate === 'function') this.forceUpdate(); };
    const inKw = typing('kw'), inField = typing('field');
    const doQuery = () => this.setState({ applied: { ...draft } });
    const doReset = () => { this._draft = { ...Q_EMPTY }; this.setState({ applied: Q_EMPTY, sub: 'in', onq: 'all', modeq: 'all' }); };
    // 一组点选项：选中的蓝框白底蓝字，点了立刻筛选；def = 默认选中的值
    const chips = (key, opts, def) => opts.map(([value, label]) => {
      const on = (st[key] || def || 'all') === value;
      return { label, pressed: on ? 'true' : 'false', border: on ? '#1e88e5' : 'transparent', bg: on ? '#ffffff' : 'transparent', color: on ? '#1e88e5' : '#333333',
        pick: () => this.setState({ [key]: value }) };
    });
    const sub = st.sub || 'in';   // 子组终端：默认「包含」，和改版前一样，点根管理组能看到全部终端
    const subChips  = chips('sub', [['ex', '不包含'], ['in', '包含']], 'in');
    const onChips   = chips('onq', [['all', '全部'], ['on', '在线'], ['off', '离线']]);
    const modeChips = chips('modeq', [['all', '全部'], ['拦截', '拦截'], ['审计', '审计'], ['学习', '学习'], ['未开启', '未开启']]);
    const fieldOpts = [['host', '终端名称'], ['ip', 'IP地址']].map(([value, label]) => ({ value, label, sel: draft.field === value }));

    // ======== 表格行 ========
    // 先按左侧分组 + 子组终端取范围，再叠加高级搜索的条件
    const scope = TERMS.filter((t) => sub === 'in' ? isUnder(t.group, curGroup) : t.group === curGroup);
    const qkw = applied.kw.trim().toLowerCase();
    const list = scope.filter((t) => {
      if ((st.onq || 'all') === 'on' && !t.on) return false;
      if ((st.onq || 'all') === 'off' && t.on) return false;
      if ((st.modeq || 'all') !== 'all' && t.mode !== st.modeq) return false;
      if (qkw && !String(t[applied.field] || '').toLowerCase().includes(qkw)) return false;   // 关键字模糊匹配
      return true;
    });
    const scopeTotal = scope.length;
    const filtering = list.length !== scope.length;
    const GRAY = '#8a94a6';
    const rows = list.map((t) => {
      return {
        ...t,
        // 点终端名称：将来跳到「终端视角」页（这台终端的进程管控信息）；该页还没做，先弹提示
        openHost: () => showToast('「终端视角」页面暂未提供，无法查看 ' + t.host + ' 的进程管控信息'),
        osFull: OS_FULL[t.host] || t.os,                    // 操作系统列：带版本号，查不到就显示系统名
        osIcon: t.os.indexOf('Windows') === 0 ? WIN : LNX,
        osColor: t.on ? '#1e88e5' : '#b0b8c4',            // 在线蓝 / 离线灰
        // 白名单 / 黑名单：显示来源（所在组 / 分配），没有显示 --（灰）
        wlText: t.wl || '--', wlFg: t.wl ? '#333333' : GRAY,   // 纯文字，不是链接
        blText: t.bl || '--', blFg: t.bl ? '#333333' : GRAY,
        lists: t.lists || '未应用名单',
        modeBg: MODE[t.mode].bg, modeFg: MODE[t.mode].fg,   // 策略模式标签颜色
      };
    });
    const isEmpty = rows.length === 0;
    // ---------- 分页 ----------
    // state.size 每页条数（默认 10）；state.page 当前页；state.pageSig 翻页时的查询条件，条件变了就回到第 1 页
    const SIZES = [10, 20, 50];
    const size = st.size || 10;
    const pages = Math.max(1, Math.ceil(rows.length / size));            // 总页数（没数据也算 1 页）
    const sig = JSON.stringify([curGroup, sub, applied, st.onq, st.modeq, size]);
    const page = Math.min(st.pageSig === sig ? (st.page || 1) : 1, pages);
    const goPage = (n) => this.setState({ page: Math.max(1, Math.min(pages, n)), pageSig: sig });
    const pageRows = rows.slice((page - 1) * size, page * size);          // 当前页的终端
    const pageBtns = Array.from({ length: pages }, (_, k) => k + 1).map((n) => ({
      n, cls: n === page ? 'on' : '', cur: n === page ? 'page' : false, go: () => goPage(n),
    }));
    const prevPage = () => goPage(page - 1), nextPage = () => goPage(page + 1);
    const noPrev = page <= 1, noNext = page >= pages;                   // 第一页 / 最后一页时按钮变灰
    const sizeOpts = SIZES.map((v) => ({ value: String(v), label: String(v), sel: v === size }));
    const pickSize = (e) => this.setState({ size: Number(e.target.value), page: 1 });
    // 跳页：输入页码按回车；超出范围自动取第一页 / 最后一页
    const jumpKey = (e) => {
      if (e.key !== 'Enter') return;
      const n = parseInt(e.target.value, 10);
      e.target.value = '';
      if (!isNaN(n)) goPage(n);
    };
    const emptyText = scope.length === 0 ? '该分组下暂无终端' : '没有符合查询条件的终端';
    const online = list.filter((t) => t.on).length, total = list.length, offline = total - online;

    return { menus, toast, toastOn, groups, groupOnline, groupTotal, groupName,
             cols, rows, pageRows, pageBtns, prevPage, nextPage, noPrev, noNext, sizeOpts, pickSize, jumpKey, isEmpty, emptyText, online, offline, total,
             advOpen, toggleAdv, advExpanded, advColor, advDeg, subChips, onChips, modeChips,
             fieldOpts, draft, inKw, inField, doQuery, doReset, filtering, scopeTotal };
  }
}

</script>
